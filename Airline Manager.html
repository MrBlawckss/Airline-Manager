/* ---- Modular HTML5 Canvas livery editor ---- */
class LiveryCanvasEditor {
  constructor(canvas, options = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.layers = [];
    this.selectedId = null;
    this.template = options.template || "aircraft";
    this.baseColor = options.baseColor || "#f4f6f8";
    this.baseImage = null;
    this.baseImageSrc = options.baseImageSrc || "";
    this.compositeCanvas = document.createElement("canvas");
    this.compositeCanvas.width = canvas.width;
    this.compositeCanvas.height = canvas.height;
    this.baseImageReady = this.setBaseImage(this.baseImageSrc);
    this.interaction = null;
    this.onChange = null;
    this.onSelectionChange = null;
    this.onStructureChange = null;
    this.onPathDrawingChange = null;
    this.draftPathId = null;
    this._boundMove = e => this.pointerMove(e);
    this._boundUp = e => this.pointerUp(e);
    canvas.addEventListener("pointerdown", e => this.pointerDown(e));
    canvas.addEventListener("keydown", e => {
      if ((e.key === "Delete" || e.key === "Backspace") && this.selectedId) {
        e.preventDefault();
        this.removeSelected();
      } else if (e.key === "Escape") {
        if (this.draftPathId) this.cancelPath();
        else this.selectLayer(null);
      }
    });
    window.addEventListener("pointermove", this._boundMove);
    window.addEventListener("pointerup", this._boundUp);
    this.render();
  }

  destroy() {
    window.removeEventListener("pointermove", this._boundMove);
    window.removeEventListener("pointerup", this._boundUp);
  }

  uid() {
    return "lv_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  selectedLayer() {
    return this.layers.find(layer => layer.id === this.selectedId) || null;
  }

  setTemplate(template) {
    this.template = template === "tail" ? "tail" : "aircraft";
    this.changed();
  }

  setBaseColor(color) {
    this.baseColor = color || "#f4f6f8";
    this.changed();
  }

  async setBaseImage(src) {
    this.baseImageSrc = src || "";
    this.baseImage = null;
    if (!this.baseImageSrc) {
      this.render();
      return null;
    }
    try {
      this.baseImage = await this.loadImage(this.baseImageSrc);
    } catch (_) {
      this.baseImage = null;
    }
    this.render();
    return this.baseImage;
  }

  baseImageBounds() {
    if (!this.baseImage) return null;
    const padding = 34;
    const imageWidth = Math.max(1, this.baseImage.naturalWidth || this.baseImage.width || 1);
    const imageHeight = Math.max(1, this.baseImage.naturalHeight || this.baseImage.height || 1);
    const scale = Math.min(
      (this.canvas.width - padding * 2) / imageWidth,
      (this.canvas.height - padding * 2) / imageHeight
    );
    const width = imageWidth * scale;
    const height = imageHeight * scale;
    return {
      x: (this.canvas.width - width) / 2,
      y: (this.canvas.height - height) / 2,
      width,
      height
    };
  }

  viewerGeometry() {
    const bounds = this.baseImageBounds();
    if (!bounds) return null;
    return {
      canvasWidth: this.canvas.width,
      canvasHeight: this.canvas.height,
      x: bounds.x,
      y: bounds.y,
      width: bounds.width,
      height: bounds.height
    };
  }

  defaultLayerPosition() {
    const bounds = this.baseImageBounds();
    if (this.template === "tail" && bounds) {
      return { x: bounds.x + bounds.width * .86, y: bounds.y + bounds.height * .43 };
    }
    return { x: this.canvas.width / 2, y: this.canvas.height / 2 };
  }

  addText(options = {}) {
    const position = this.defaultLayerPosition();
    const layer = {
      id: this.uid(), type: "text", name: options.text || "Airline text",
      text: options.text || "YOUR AIRLINE", fontFamily: options.fontFamily || "Arial",
      fontSize: Number(options.fontSize) || 64, color: options.color || "#10233f",
      bold: Boolean(options.bold), italic: Boolean(options.italic),
      x: position.x, y: position.y,
      scale: 1, rotation: 0, opacity: 1
    };
    this.layers.push(layer);
    this.selectLayer(layer.id);
    this.structureChanged();
    return layer;
  }

  addSquare(options = {}) {
    const position = this.defaultLayerPosition();
    const layer = {
      id: this.uid(), type: "square", name: "Square",
      width: Math.max(20, Number(options.width) || 360),
      height: Math.max(1, Number(options.height) || 120),
      fillColor: options.fillColor || "#10233f",
      outlineThickness: Math.max(0, Number(options.outlineThickness) || 0),
      outlineColor: options.outlineColor || "#ffffff",
      x: position.x, y: position.y,
      scale: 1, rotation: 0, opacity: 1
    };
    this.layers.push(layer);
    this.selectLayer(layer.id);
    this.structureChanged();
    return layer;
  }

  startPath(options = {}) {
    if (this.draftPathId) this.cancelPath();
    const layer = {
      id: this.uid(), type: "path", name: "Point line", points: [], draft: true,
      fillEnabled: Boolean(options.fillEnabled),
      curved: Boolean(options.curved),
      fillColor: options.fillColor || "#10233f",
      outlineColor: options.outlineColor || "#ffffff",
      outlineThickness: Math.max(1, Number(options.outlineThickness) || 6),
      x: 0, y: 0, scale: 1, rotation: 0, opacity: 1
    };
    this.layers.push(layer);
    this.draftPathId = layer.id;
    this.selectedId = layer.id;
    this.structureChanged();
    if (this.onSelectionChange) this.onSelectionChange(layer);
    if (this.onPathDrawingChange) this.onPathDrawingChange(layer);
    return layer;
  }

  draftPath() {
    return this.layers.find(layer => layer.id === this.draftPathId && layer.type === "path") || null;
  }

  addPathPoint(point) {
    const layer = this.draftPath();
    if (!layer) return;
    if (!layer.points.length) {
      layer.x = point.x;
      layer.y = point.y;
      layer.points.push({ x: 0, y: 0 });
    } else {
      layer.points.push({ x: point.x - layer.x, y: point.y - layer.y });
    }
    if (layer.curved) this.ensurePathHandles(layer, true);
    this.changed();
    if (this.onPathDrawingChange) this.onPathDrawingChange(layer);
  }

  finishPath() {
    const layer = this.draftPath();
    if (!layer) return null;
    if (layer.points.length < 2) {
      this.cancelPath();
      return null;
    }
    const xs = layer.points.map(point => point.x);
    const ys = layer.points.map(point => point.y);
    const centerX = (Math.min(...xs) + Math.max(...xs)) / 2;
    const centerY = (Math.min(...ys) + Math.max(...ys)) / 2;
    layer.x += centerX;
    layer.y += centerY;
    layer.points = layer.points.map(point => ({ x: point.x - centerX, y: point.y - centerY }));
    if (layer.curved) this.ensurePathHandles(layer, true);
    layer.draft = false;
    this.draftPathId = null;
    this.structureChanged();
    if (this.onSelectionChange) this.onSelectionChange(layer);
    if (this.onPathDrawingChange) this.onPathDrawingChange(null);
    return layer;
  }

  ensurePathHandles(layer, force = false) {
    if (!layer || layer.type !== "path" || !Array.isArray(layer.points)) return;
    const points = layer.points;
    points.forEach((point, index) => {
      if (!force && Number.isFinite(point.handleX) && Number.isFinite(point.handleY)) return;
      const previous = points[index - 1] || (layer.fillEnabled ? points[points.length - 1] : point);
      const next = points[index + 1] || (layer.fillEnabled ? points[0] : point);
      point.handleX = ((next?.x ?? point.x) - (previous?.x ?? point.x)) / 6;
      point.handleY = ((next?.y ?? point.y) - (previous?.y ?? point.y)) / 6;
    });
  }

  setSelectedPathCurved(enabled) {
    const layer = this.selectedLayer();
    if (!layer || layer.type !== "path") return;
    layer.curved = Boolean(enabled);
    if (layer.curved) this.ensurePathHandles(layer);
    this.changed();
  }

  setSelectedPathFillEnabled(enabled) {
    const layer = this.selectedLayer();
    if (!layer || layer.type !== "path") return;
    layer.fillEnabled = Boolean(enabled);
    if (layer.curved) this.ensurePathHandles(layer, true);
    this.changed();
  }

  recenterPath(layer) {
    if (!layer || layer.type !== "path" || !Array.isArray(layer.points) || !layer.points.length) return;
    const xs = layer.points.map(point => point.x), ys = layer.points.map(point => point.y);
    const centerX = (Math.min(...xs) + Math.max(...xs)) / 2;
    const centerY = (Math.min(...ys) + Math.max(...ys)) / 2;
    if (Math.abs(centerX) < .001 && Math.abs(centerY) < .001) return;
    const scale = layer.scale || 1, angle = layer.rotation || 0;
    const dx = centerX * scale, dy = centerY * scale;
    layer.x += dx * Math.cos(angle) - dy * Math.sin(angle);
    layer.y += dx * Math.sin(angle) + dy * Math.cos(angle);
    layer.points.forEach(point => { point.x -= centerX; point.y -= centerY; });
  }

  cancelPath() {
    const layer = this.draftPath();
    if (layer) this.layers = this.layers.filter(item => item.id !== layer.id);
    this.draftPathId = null;
    this.selectedId = null;
    this.structureChanged();
    if (this.onSelectionChange) this.onSelectionChange(null);
    if (this.onPathDrawingChange) this.onPathDrawingChange(null);
  }

  async addImageFile(file) {
    if (!file) return null;
    const allowed = ["image/png", "image/svg+xml"];
    const extensionOkay = /\.(png|svg)$/i.test(file.name || "");
    if (!allowed.includes(file.type) && !extensionOkay) throw new Error("Only PNG and SVG decals are supported.");
    if (file.size > 4 * 1024 * 1024) throw new Error("Decals must be smaller than 4 MB.");

    let dataUrl;
    if (file.type === "image/svg+xml" || /\.svg$/i.test(file.name || "")) {
      const svgText = await this.readFile(file, "text");
      const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
      if (doc.querySelector("parsererror")) throw new Error("That SVG file could not be read.");
      doc.querySelectorAll("script, foreignObject").forEach(node => node.remove());
      doc.querySelectorAll("*").forEach(node => {
        [...node.attributes].forEach(attr => {
          const key = attr.name.toLowerCase();
          const value = attr.value.trim().toLowerCase();
          if (key.startsWith("on") || ((key === "href" || key.endsWith(":href")) && /^(https?:|javascript:)/.test(value))) {
            node.removeAttribute(attr.name);
          }
        });
      });
      const cleaned = new XMLSerializer().serializeToString(doc.documentElement);
      dataUrl = await this.readFile(new Blob([cleaned], { type: "image/svg+xml" }), "dataUrl");
    } else {
      dataUrl = await this.readFile(file, "dataUrl");
    }

    let image = await this.loadImage(dataUrl);
    if (!(file.type === "image/svg+xml" || /\.svg$/i.test(file.name || ""))) {
      dataUrl = this.compactRasterImage(image);
      image = await this.loadImage(dataUrl);
    }
    const maxDisplayWidth = 360;
    const width = Math.min(maxDisplayWidth, image.naturalWidth || maxDisplayWidth);
    const height = width * ((image.naturalHeight || width) / (image.naturalWidth || width));
    const position = this.defaultLayerPosition();
    const layer = {
      id: this.uid(), type: "image", name: (file.name || "Decal").replace(/\.(png|svg)$/i, ""),
      src: dataUrl, image, width, height,
      x: position.x, y: position.y,
      scale: 1, rotation: 0, opacity: 1
    };
    this.layers.push(layer);
    this.selectLayer(layer.id);
    this.structureChanged();
    return layer;
  }

  compactRasterImage(image) {
    const maxDimension = 1024;
    const naturalWidth = Math.max(1, image.naturalWidth || image.width || 1);
    const naturalHeight = Math.max(1, image.naturalHeight || image.height || 1);
    const ratio = Math.min(1, maxDimension / Math.max(naturalWidth, naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(naturalWidth * ratio));
    canvas.height = Math.max(1, Math.round(naturalHeight * ratio));
    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/webp", .88);
  }

  readFile(file, mode) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("The decal file could not be read."));
      if (mode === "text") reader.readAsText(file);
      else reader.readAsDataURL(file);
    });
  }

  loadImage(src) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("The decal image could not be loaded."));
      image.src = src;
    });
  }

  selectLayer(id) {
    this.selectedId = id && this.layers.some(layer => layer.id === id) ? id : null;
    this.canvas.focus({ preventScroll: true });
    this.render();
    if (this.onSelectionChange) this.onSelectionChange(this.selectedLayer());
  }

  updateSelected(values) {
    const layer = this.selectedLayer();
    if (!layer) return;
    Object.assign(layer, values);
    if (values.text !== undefined) layer.name = values.text || "Text";
    this.changed();
  }

  removeSelected() {
    const index = this.layers.findIndex(layer => layer.id === this.selectedId);
    if (index < 0) return;
    const removedDraft = this.layers[index].id === this.draftPathId;
    this.layers.splice(index, 1);
    if (removedDraft) this.draftPathId = null;
    this.selectedId = null;
    this.structureChanged();
    if (this.onSelectionChange) this.onSelectionChange(null);
    if (removedDraft && this.onPathDrawingChange) this.onPathDrawingChange(null);
  }

  moveSelected(delta) {
    const index = this.layers.findIndex(layer => layer.id === this.selectedId);
    if (index < 0) return;
    const target = Math.max(0, Math.min(this.layers.length - 1, index + delta));
    if (target === index) return;
    const [layer] = this.layers.splice(index, 1);
    this.layers.splice(target, 0, layer);
    this.structureChanged();
  }

  sendSelected(where) {
    const index = this.layers.findIndex(layer => layer.id === this.selectedId);
    if (index < 0) return;
    const [layer] = this.layers.splice(index, 1);
    if (where === "front") this.layers.push(layer);
    else this.layers.unshift(layer);
    this.structureChanged();
  }

  layerSize(layer, ctx = this.ctx) {
    if (layer.type === "text") {
      ctx.save();
      ctx.font = this.textFont(layer);
      const metrics = ctx.measureText(layer.text || "Text");
      ctx.restore();
      return { width: Math.max(20, metrics.width), height: Math.max(20, (layer.fontSize || 64) * 1.15) };
    }
    if (layer.type === "square") {
      const outline = Math.max(0, Number(layer.outlineThickness) || 0);
      return {
        width: Math.max(20, Number(layer.width) || 360) + outline * 2,
        height: Math.max(1, Number(layer.height) || 120) + outline * 2
      };
    }
    if (layer.type === "path") {
      const points = Array.isArray(layer.points) ? layer.points : [];
      if (!points.length) return { width: 24, height: 24 };
      const xs = points.flatMap(point => layer.curved
        ? [point.x, point.x + (point.handleX || 0), point.x - (point.handleX || 0)]
        : [point.x]);
      const ys = points.flatMap(point => layer.curved
        ? [point.y, point.y + (point.handleY || 0), point.y - (point.handleY || 0)]
        : [point.y]);
      const outline = Math.max(1, Number(layer.outlineThickness) || 1);
      return {
        width: Math.max(24, Math.max(...xs) - Math.min(...xs) + outline * 2),
        height: Math.max(24, Math.max(...ys) - Math.min(...ys) + outline * 2)
      };
    }
    return { width: layer.width || 200, height: layer.height || 120 };
  }

  textFont(layer) {
    const family = String(layer.fontFamily || "Arial").replace(/["\\]/g, "");
    const style = layer.italic ? "italic " : "";
    const weight = layer.bold ? "bold " : "";
    return `${style}${weight}${layer.fontSize || 64}px "${family}"`;
  }

  canvasPoint(event) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * this.canvas.width / rect.width,
      y: (event.clientY - rect.top) * this.canvas.height / rect.height
    };
  }

  localPoint(layer, point) {
    const angle = -(layer.rotation || 0);
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const dx = point.x - layer.x, dy = point.y - layer.y;
    const scale = layer.scale || 1;
    return { x: (dx * cos - dy * sin) / scale, y: (dx * sin + dy * cos) / scale };
  }

  hitLayer(point) {
    for (let i = this.layers.length - 1; i >= 0; i--) {
      const layer = this.layers[i];
      const local = this.localPoint(layer, point);
      const size = this.layerSize(layer);
      if (Math.abs(local.x) <= size.width / 2 && Math.abs(local.y) <= size.height / 2) return layer;
    }
    return null;
  }

  hitHandle(layer, point) {
    if (!layer) return null;
    const local = this.localPoint(layer, point);
    const size = this.layerSize(layer);
    const tolerance = 15 / Math.max(.15, layer.scale || 1);
    const scaleX = size.width / 2, scaleY = size.height / 2;
    const rotateY = -size.height / 2 - 38 / Math.max(.15, layer.scale || 1);
    if (Math.hypot(local.x - scaleX, local.y - scaleY) <= tolerance) return "scale";
    if (Math.hypot(local.x, local.y - rotateY) <= tolerance) return "rotate";
    return null;
  }

  hitPathControl(layer, point) {
    if (!layer || layer.type !== "path" || !Array.isArray(layer.points)) return null;
    const local = this.localPoint(layer, point);
    const tolerance = 14 / Math.max(.15, layer.scale || 1);
    if (layer.curved) {
      for (let index = layer.points.length - 1; index >= 0; index--) {
        const node = layer.points[index];
        const handleX = node.handleX || 0, handleY = node.handleY || 0;
        if (Math.hypot(local.x - node.x - handleX, local.y - node.y - handleY) <= tolerance) {
          return { mode: "path-handle-out", index };
        }
        if (Math.hypot(local.x - node.x + handleX, local.y - node.y + handleY) <= tolerance) {
          return { mode: "path-handle-in", index };
        }
      }
    }
    for (let index = layer.points.length - 1; index >= 0; index--) {
      const node = layer.points[index];
      if (Math.hypot(local.x - node.x, local.y - node.y) <= tolerance) return { mode: "path-point", index };
    }
    return null;
  }

  pointerDown(event) {
    if (event.button !== 0) return;
    const point = this.canvasPoint(event);
    if (this.draftPathId) {
      this.addPathPoint(point);
      event.preventDefault();
      return;
    }
    const selected = this.selectedLayer();
    const pathControl = this.hitPathControl(selected, point);
    const handle = pathControl ? null : this.hitHandle(selected, point);
    if (pathControl && selected) {
      this.interaction = { ...pathControl, id: selected.id };
    } else if (handle && selected) {
      if (handle === "scale" && selected.type === "square" && selected.scale !== 1) {
        const existingScale = Math.max(.1, selected.scale || 1);
        selected.width = Math.max(20, (selected.width || 360) * existingScale);
        selected.height = Math.max(1, (selected.height || 120) * existingScale);
        selected.outlineThickness = Math.max(0, (selected.outlineThickness || 0) * existingScale);
        selected.scale = 1;
        this.render();
      }
      this.interaction = {
        mode: handle, id: selected.id, start: point, startScale: selected.scale,
        startRotation: selected.rotation,
        startAngle: Math.atan2(point.y - selected.y, point.x - selected.x),
        startDistance: Math.max(1, Math.hypot(point.x - selected.x, point.y - selected.y))
      };
    } else {
      const layer = this.hitLayer(point);
      this.selectLayer(layer ? layer.id : null);
      if (layer) this.interaction = { mode: "drag", id: layer.id, start: point, startX: layer.x, startY: layer.y };
    }
    if (this.interaction) {
      this.canvas.setPointerCapture && this.canvas.setPointerCapture(event.pointerId);
      event.preventDefault();
    }
  }

  pointerMove(event) {
    if (!this.interaction) return;
    const layer = this.layers.find(item => item.id === this.interaction.id);
    if (!layer) return;
    const point = this.canvasPoint(event);
    if (this.interaction.mode === "path-point") {
      const local = this.localPoint(layer, point);
      const node = layer.points[this.interaction.index];
      if (node) { node.x = local.x; node.y = local.y; }
    } else if (this.interaction.mode === "path-handle-out" || this.interaction.mode === "path-handle-in") {
      const local = this.localPoint(layer, point);
      const node = layer.points[this.interaction.index];
      if (node) {
        const direction = this.interaction.mode === "path-handle-out" ? 1 : -1;
        node.handleX = (local.x - node.x) * direction;
        node.handleY = (local.y - node.y) * direction;
      }
    } else if (this.interaction.mode === "drag") {
      layer.x = this.interaction.startX + point.x - this.interaction.start.x;
      layer.y = this.interaction.startY + point.y - this.interaction.start.y;
    } else if (this.interaction.mode === "scale") {
      if (layer.type === "square") {
        const local = this.localPoint(layer, point);
        const outline = Math.max(0, Number(layer.outlineThickness) || 0);
        layer.width = Math.max(20, Math.min(1000, Math.abs(local.x) * 2 - outline * 2));
        layer.height = Math.max(1, Math.min(500, Math.abs(local.y) * 2 - outline * 2));
      } else {
        const distance = Math.hypot(point.x - layer.x, point.y - layer.y);
        layer.scale = Math.max(.1, Math.min(5, this.interaction.startScale * distance / this.interaction.startDistance));
      }
    } else if (this.interaction.mode === "rotate") {
      const angle = Math.atan2(point.y - layer.y, point.x - layer.x);
      layer.rotation = this.interaction.startRotation + angle - this.interaction.startAngle;
    }
    this.changed();
  }

  pointerUp() {
    const interaction = this.interaction;
    if (interaction?.mode === "path-point") {
      const layer = this.layers.find(item => item.id === interaction.id);
      this.recenterPath(layer);
      this.changed();
    }
    this.interaction = null;
  }

  templatePath() {
    const path = new Path2D();
    if (this.template === "tail") {
      path.moveTo(330, 430);
      path.lineTo(515, 80);
      path.quadraticCurveTo(545, 35, 585, 76);
      path.lineTo(865, 430);
      path.closePath();
    } else {
      path.moveTo(72, 264);
      path.quadraticCurveTo(98, 202, 206, 197);
      path.lineTo(832, 197);
      path.lineTo(965, 78);
      path.quadraticCurveTo(990, 55, 1005, 101);
      path.lineTo(1050, 198);
      path.lineTo(1120, 215);
      path.quadraticCurveTo(1175, 231, 1120, 276);
      path.lineTo(850, 305);
      path.lineTo(676, 420);
      path.lineTo(610, 420);
      path.lineTo(690, 303);
      path.lineTo(224, 303);
      path.quadraticCurveTo(102, 301, 72, 264);
      path.closePath();
    }
    return path;
  }

  drawLayer(ctx, layer) {
    ctx.save();
    ctx.translate(layer.x, layer.y);
    ctx.rotate(layer.rotation || 0);
    ctx.scale(layer.scale || 1, layer.scale || 1);
    ctx.globalAlpha = Number.isFinite(layer.opacity) ? layer.opacity : 1;
    if (layer.type === "text") {
      ctx.font = this.textFont(layer);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = layer.color || "#10233f";
      ctx.fillText(layer.text || "Text", 0, 0);
    } else if (layer.type === "square") {
      const width = Math.max(20, Number(layer.width) || 360);
      const height = Math.max(1, Number(layer.height) || 120);
      const outline = Math.max(0, Number(layer.outlineThickness) || 0);
      if (outline > 0) {
        ctx.fillStyle = layer.outlineColor || "#ffffff";
        ctx.fillRect(-width / 2 - outline, -height / 2 - outline, width + outline * 2, height + outline * 2);
      }
      ctx.fillStyle = layer.fillColor || "#10233f";
      ctx.fillRect(-width / 2, -height / 2, width, height);
    } else if (layer.type === "path") {
      const points = Array.isArray(layer.points) ? layer.points : [];
      if (points.length) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let index = 1; index < points.length; index++) {
          const previous = points[index - 1];
          const point = points[index];
          if (layer.curved) {
            ctx.bezierCurveTo(
              previous.x + (previous.handleX || 0), previous.y + (previous.handleY || 0),
              point.x - (point.handleX || 0), point.y - (point.handleY || 0),
              point.x, point.y
            );
          } else {
            ctx.lineTo(point.x, point.y);
          }
        }
        if (layer.fillEnabled && points.length >= 3) {
          if (layer.curved) {
            const last = points[points.length - 1], first = points[0];
            ctx.bezierCurveTo(
              last.x + (last.handleX || 0), last.y + (last.handleY || 0),
              first.x - (first.handleX || 0), first.y - (first.handleY || 0),
              first.x, first.y
            );
          }
          ctx.closePath();
          ctx.fillStyle = layer.fillColor || "#10233f";
          ctx.fill();
        }
        if (points.length >= 2) {
          ctx.strokeStyle = layer.outlineColor || "#ffffff";
          ctx.lineWidth = Math.max(1, Number(layer.outlineThickness) || 1);
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.stroke();
        }
      }
    } else if (layer.image && layer.image.complete) {
      ctx.drawImage(layer.image, -(layer.width || 200) / 2, -(layer.height || 120) / 2, layer.width || 200, layer.height || 120);
    }
    ctx.restore();
  }

  drawSelection(ctx, layer) {
    if (!layer || layer.draft) return;
    const size = this.layerSize(layer, ctx);
    const scale = Math.max(.15, layer.scale || 1);
    ctx.save();
    ctx.translate(layer.x, layer.y);
    ctx.rotate(layer.rotation || 0);
    ctx.scale(scale, scale);
    ctx.strokeStyle = "#f5b942";
    ctx.fillStyle = "#f5b942";
    ctx.lineWidth = 2 / scale;
    ctx.setLineDash([8 / scale, 6 / scale]);
    ctx.strokeRect(-size.width / 2, -size.height / 2, size.width, size.height);
    ctx.setLineDash([]);
    const radius = 7 / scale;
    ctx.beginPath();
    ctx.arc(size.width / 2, size.height / 2, radius, 0, Math.PI * 2);
    ctx.fill();
    const rotateY = -size.height / 2 - 38 / scale;
    ctx.beginPath();
    ctx.moveTo(0, -size.height / 2);
    ctx.lineTo(0, rotateY);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, rotateY, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  drawPathNodes(ctx, layer) {
    if (!layer || layer.type !== "path" || !Array.isArray(layer.points)) return;
    const scale = Math.max(.15, layer.scale || 1);
    ctx.save();
    ctx.translate(layer.x, layer.y);
    ctx.rotate(layer.rotation || 0);
    ctx.scale(scale, scale);
    if (layer.curved) {
      layer.points.forEach(point => {
        const handleX = point.handleX || 0, handleY = point.handleY || 0;
        ctx.beginPath();
        ctx.moveTo(point.x - handleX, point.y - handleY);
        ctx.lineTo(point.x + handleX, point.y + handleY);
        ctx.strokeStyle = "rgba(56,189,248,.85)";
        ctx.lineWidth = 2 / scale;
        ctx.stroke();
        [[point.x - handleX, point.y - handleY], [point.x + handleX, point.y + handleY]].forEach(handle => {
          ctx.beginPath();
          ctx.arc(handle[0], handle[1], 5.5 / scale, 0, Math.PI * 2);
          ctx.fillStyle = "#8b5cf6";
          ctx.fill();
          ctx.strokeStyle = "#081321";
          ctx.lineWidth = 1.5 / scale;
          ctx.stroke();
        });
      });
    }
    layer.points.forEach((point, index) => {
      ctx.beginPath();
      ctx.arc(point.x, point.y, 7 / scale, 0, Math.PI * 2);
      ctx.fillStyle = index === 0 ? "#38bdf8" : "#f5b942";
      ctx.fill();
      ctx.strokeStyle = "#081321";
      ctx.lineWidth = 2 / scale;
      ctx.stroke();
    });
    ctx.restore();
  }

  draw(ctx, includeSelection) {
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    const bounds = this.baseImageBounds();
    const renderLayers = includeSelection ? this.layers : this.layers.filter(layer => !layer.draft);
    if (this.baseImage && bounds) {
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,.38)";
      ctx.shadowBlur = 18;
      ctx.drawImage(this.baseImage, bounds.x, bounds.y, bounds.width, bounds.height);
      ctx.restore();

      const composite = this.compositeCanvas;
      const compositeCtx = composite.getContext("2d");
      compositeCtx.clearRect(0, 0, composite.width, composite.height);
      compositeCtx.globalCompositeOperation = "source-over";
      renderLayers.forEach(layer => this.drawLayer(compositeCtx, layer));
      compositeCtx.globalCompositeOperation = "destination-in";
      compositeCtx.drawImage(this.baseImage, bounds.x, bounds.y, bounds.width, bounds.height);
      if (this.template === "tail") {
        compositeCtx.fillStyle = "#fff";
        compositeCtx.fillRect(bounds.x + bounds.width * .72, bounds.y, bounds.width * .28, bounds.height);
      }
      compositeCtx.globalCompositeOperation = "source-over";
      ctx.drawImage(composite, 0, 0);

      // Put the real aircraft's windows, doors, panel lines, and shadows back
      // above the paint while allowing the livery colour to remain visible.
      ctx.save();
      ctx.globalCompositeOperation = "multiply";
      ctx.drawImage(this.baseImage, bounds.x, bounds.y, bounds.width, bounds.height);
      ctx.restore();
    } else {
      const path = this.templatePath();
      ctx.save();
      ctx.fillStyle = this.baseColor;
      ctx.fill(path);
      ctx.clip(path);
      renderLayers.forEach(layer => this.drawLayer(ctx, layer));
      ctx.restore();
      ctx.strokeStyle = "#6f89a8";
      ctx.lineWidth = 4;
      ctx.stroke(path);
    }
    if (includeSelection) {
      const selected = this.selectedLayer();
      this.drawSelection(ctx, selected);
      this.drawPathNodes(ctx, selected);
    }
  }

  render() {
    this.draw(this.ctx, true);
  }

  changed() {
    this.render();
    if (this.onChange) this.onChange(this.selectedLayer());
  }

  structureChanged() {
    this.changed();
    if (this.onStructureChange) this.onStructureChange();
  }

  serialize() {
    return {
      version: 1,
      template: this.template,
      baseColor: this.baseColor,
      layers: this.layers.filter(layer => !layer.draft).map(layer => {
        const copy = { ...layer };
        delete copy.image;
        return copy;
      })
    };
  }

  async restore(data) {
    this.template = data && data.template === "tail" ? "tail" : "aircraft";
    this.baseColor = data && data.baseColor || "#f4f6f8";
    this.layers = data && Array.isArray(data.layers) ? data.layers.map(layer => {
      const copy = { ...layer };
      // Older saves called the rectangular shape a line. Keep those designs,
      // but migrate them to the new square layer.
      if (copy.type === "line") {
        copy.type = "square";
        copy.name = copy.name === "Line" ? "Square" : (copy.name || "Square");
        copy.width = copy.length || 360;
        copy.height = copy.thickness || 18;
        delete copy.length;
        delete copy.thickness;
      }
      if (copy.type === "path") {
        copy.points = Array.isArray(copy.points) ? copy.points.map(point => ({ ...point })) : [];
        copy.draft = false;
      }
      return copy;
    }) : [];
    this.draftPathId = null;
    this.layers.filter(layer => layer.type === "path" && layer.curved).forEach(layer => this.ensurePathHandles(layer));
    await this.baseImageReady;
    await Promise.all(this.layers.filter(layer => layer.type === "image" && layer.src).map(async layer => {
      try { layer.image = await this.loadImage(layer.src); } catch (_) { layer.image = null; }
    }));
    this.selectedId = null;
    this.render();
  }

  exportDataURL(type = "image/png", quality = 1) {
    const output = document.createElement("canvas");
    output.width = this.canvas.width;
    output.height = this.canvas.height;
    this.draw(output.getContext("2d"), false);
    return output.toDataURL(type, quality);
  }

  drawOverlay(ctx) {
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    const bounds = this.baseImageBounds();
    ctx.save();
    if (this.template === "tail" && bounds) {
      ctx.beginPath();
      ctx.rect(bounds.x + bounds.width * .72, bounds.y, bounds.width * .28, bounds.height);
      ctx.clip();
    }
    this.layers.filter(layer => !layer.draft).forEach(layer => this.drawLayer(ctx, layer));
    ctx.restore();
    if (this.baseImage && bounds) {
      ctx.save();
      ctx.globalCompositeOperation = "destination-in";
      ctx.drawImage(this.baseImage, bounds.x, bounds.y, bounds.width, bounds.height);
      ctx.restore();
    }
  }

  exportOverlayDataURL(type = "image/png", quality = 1) {
    const output = document.createElement("canvas");
    output.width = this.canvas.width;
    output.height = this.canvas.height;
    this.drawOverlay(output.getContext("2d"));
    return output.toDataURL(type, quality);
  }

  exportOverlayBlob(type = "image/png", quality = 1) {
    const output = document.createElement("canvas");
    output.width = this.canvas.width;
    output.height = this.canvas.height;
    this.drawOverlay(output.getContext("2d"));
    return new Promise(resolve => output.toBlob(resolve, type, quality));
  }

  exportBlob(type = "image/png", quality = 1) {
    const output = document.createElement("canvas");
    output.width = this.canvas.width;
    output.height = this.canvas.height;
    this.draw(output.getContext("2d"), false);
    return new Promise(resolve => output.toBlob(resolve, type, quality));
  }
}

function updateLiveryPathDrawingUi(layer) {

  if (startButton) startButton.textContent = layer ? "Cancel drawing" : "Start drawing";

  if (status) status.textContent = layer
    ? `${layer.points.length} dot${layer.points.length === 1 ? "" : "s"} placed. Click the plane to add more, then press Finish.`
    : "Click Start drawing, then click the plane to place connected dots.";
  if (startButton) {
    startButton.onclick = () => {
      if (activeLiveryEditor?.draftPathId) {
        activeLiveryEditor.cancelPath();
      } else {
        activeLiveryEditor.startPath({
          curved: document.getElementById("liveryPathCurved").checked,
          fillEnabled: document.getElementById("liveryPathFillEnabled").checked,

function updateLiveryDirtyState(layer) {
  const status = document.getElementById("liverySaveStatus");
  if (status) status.textContent = "Unsaved changes";
  if (!layer) return;
  const scale = document.getElementById("liverySelectedScale");
  const rotation = document.getElementById("liverySelectedRotation");
  const opacity = document.getElementById("liverySelectedOpacity");
  if (scale) {
    scale.value = Math.max(.1, Math.min(5, layer.scale || 1));
    const output = document.getElementById("liveryScaleOutput");
    if (output) output.textContent = Number(layer.scale || 1).toFixed(2) + "×";
  }
  if (rotation) {
    rotation.value = Math.round((layer.rotation || 0) * 180 / Math.PI);
    const output = document.getElementById("liveryRotationOutput");
    if (output) output.textContent = rotation.value + "°";
  }
  if (opacity) {
    opacity.value = Number.isFinite(layer.opacity) ? layer.opacity : 1;
    const output = document.getElementById("liveryOpacityOutput");
    if (output) output.textContent = Math.round(opacity.value * 100) + "%";
  }
}

async function saveCurrentLivery(silent = false) {
  if (!activeLiveryEditor || !liveryAircraftFid) return false;
  if (activeLiveryEditor.draftPathId) {
    toast("Finish or cancel the point line before saving.");
    return false;
  }
  await activeLiveryEditor.baseImageReady;
  const previous = state.liveries[liveryAircraftFid];
  let overlayDataUrl = null;
  try { overlayDataUrl = activeLiveryEditor.exportOverlayDataURL("image/png"); } catch (_) {}
  state.liveries[liveryAircraftFid] = {
    ...activeLiveryEditor.serialize(),
    previewDataUrl: null,
    overlayDataUrl,
    viewerGeometry: activeLiveryEditor.viewerGeometry()
  };
  if (!saveGame()) {
    if (previous) state.liveries[liveryAircraftFid] = previous;
    else delete state.liveries[liveryAircraftFid];
    toast("The livery is too large to save. Remove or simplify a decal and try again.");
    return false;
  }
  const status = document.getElementById("liverySaveStatus");
  if (status) status.textContent = "Saved to aircraft";
  const aircraft = state.fleet.find(f => f.fid === liveryAircraftFid);
  if (!silent) toast(`Livery saved to ${aircraft ? aircraft.reg : "aircraft"}.`);
  return true;
}

async function renderLiveryPreviewForAircraft(design, aircraft) {
  const canvas = document.createElement("canvas");
  canvas.width = 1200;
  canvas.height = 500;
  const type = aircraftTypeById(aircraft.typeId);
  const editor = new LiveryCanvasEditor(canvas, {
    ...design,
    baseImageSrc: aircraftExportImageAssetUrl(type.id)
  });
  await editor.restore(design);
  let overlayDataUrl = null;
  try { overlayDataUrl = editor.exportOverlayDataURL("image/png"); } catch (_) {}
  const viewerGeometry = editor.viewerGeometry();
  editor.destroy();
  return { previewDataUrl: null, overlayDataUrl, viewerGeometry };
}

async function copyCurrentLiveryToFleet() {
  if (!activeLiveryEditor || !liveryAircraftFid) return;
  const destinationValue = document.getElementById("liveryCopyDestination").value;
  const targets = state.fleet.filter(f => f.fid !== liveryAircraftFid && (destinationValue === "__all__" || f.fid === destinationValue));
  if (!targets.length) { toast("Choose another aircraft first."); return; }

  const status = document.getElementById("liverySaveStatus");
  if (status) status.textContent = `Copying to ${targets.length} aircraft…`;
  if (!await saveCurrentLivery(true)) return;

  const design = activeLiveryEditor.serialize();
  const previous = new Map(targets.map(target => [target.fid, state.liveries[target.fid]]));
  try {
    for (const target of targets) {
      const targetDesign = JSON.parse(JSON.stringify(design));
      const rendered = await renderLiveryPreviewForAircraft(targetDesign, target);
      targetDesign.previewDataUrl = rendered.previewDataUrl;
      targetDesign.overlayDataUrl = rendered.overlayDataUrl;
      targetDesign.viewerGeometry = rendered.viewerGeometry;
      state.liveries[target.fid] = targetDesign;
    }
    if (!saveGame()) throw new Error("storage");
  } catch (_) {
    targets.forEach(target => {
      const oldLivery = previous.get(target.fid);
      if (oldLivery) state.liveries[target.fid] = oldLivery;
      else delete state.liveries[target.fid];
    });
    toast("The copied liveries are too large to save. Try a smaller decal or copy to fewer aircraft.");
    if (status) status.textContent = "Copy failed";
    return;
  }
  if (status) status.textContent = `Copied to ${targets.length} aircraft`;
  toast(`Livery copied to ${targets.length} aircraft${targets.length === 1 ? "" : "s"}.`);
}

async function downloadCurrentLivery(includeAircraft = false) {
  if (!activeLiveryEditor) return;
  if (activeLiveryEditor.draftPathId) {
    toast("Finish or cancel the point line before exporting.");
    return;
  }
  await activeLiveryEditor.baseImageReady;
  if (includeAircraft && !activeLiveryEditor.baseImage) {
    toast("The aircraft image could not be loaded, so the complete PNG cannot be exported.");
    return;
  }
  let blob = null;
  try {
    blob = includeAircraft
      ? await activeLiveryEditor.exportBlob("image/png")
      : await activeLiveryEditor.exportOverlayBlob("image/png");
  } catch (_) {}
  if (!blob) { toast("The PNG could not be exported."); return; }
  const aircraft = state.fleet.find(f => f.fid === liveryAircraftFid);
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = (aircraft ? aircraft.reg : "aircraft") + (includeAircraft ? "-plane-and-livery.png" : "-livery-decals.png");
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(includeAircraft ? "Downloaded the plane with its livery." : "Downloaded the transparent livery decals.");
}

async function copyCurrentLiveryDataUrl() {
  if (!activeLiveryEditor) return;
  let dataUrl;
  let decalsOnly = false;
  try { dataUrl = activeLiveryEditor.exportDataURL("image/png"); }
  catch (_) {
    decalsOnly = true;
    dataUrl = activeLiveryEditor.exportOverlayDataURL("image/png");
  }
  try {
    await navigator.clipboard.writeText(dataUrl);
    toast(decalsOnly ? "Transparent decal Data URL copied." : "Texture Data URL copied.");
  } catch (_) {
    showModal(`
      <h2>Exported texture Data URL</h2>
      <p class="modal-sub">Copy this value into any 2D or 3D material loader.</p>
      <textarea style="width:100%;height:180px;" readonly>${escapeHtml(dataUrl)}</textarea>
      <button class="btn btn-primary" onclick="closeModal()">Done</button>
    `);
  }
}

function cheatGiveFreeAircraft(typeId) {
  const type = aircraftTypeById(typeId);
  if (!type) return;
  const reg = "VH-A" + String(state.regCounter++).padStart(2, "0");
  let lat = -31.94, lon = 115.97;
  if (state.hubs.length) { const h = airportByIata(state.hubs[0]); lat = h.lat; lon = h.lon; }
  const f = {
    fid: uid("ac"), typeId, reg, status: "Idle", routeId: null,
    lat, lon, progress: 0, dir: "out", legIndex: 0, heading: 0,
    profitGenerated: 0, purchasePrice: type.price, purchasedAt: state.gameMinutes,
    homeIata: state.hubs[0] || null
  };
  ensureAircraftOperations(f);
  state.fleet.push(f);
  renderTopBar();
  saveGame();
  toast(`🎁 Free ${type.name} added — registration ${reg}`);
}

/* ---- Misc UI helpers ---- */
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

let toastTimeout = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("visible");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove("visible"), 2600);
}

/* -------------------------------------------------------------------------
   7. EVENT HANDLERS / INIT
   ------------------------------------------------------------------------- */
function init() {
  const hadSave = loadGame();
  if (!hadSave) state = defaultState();
  const hadOfflineTimestamp = hadSave && Number.isFinite(state.lastSavedAt);
  if (!state.lastRenderedFinDay) state.lastRenderedFinDay = 0;

  // Migrate saves created before the onboarding flow existed — don't force
  // returning players who already have an airline through setup again.
  if (hadSave && state.setupComplete === undefined) {
    state.setupComplete = true;
    state.airlineCode = state.airlineCode || "SKY";
    state.airlineCountry = state.airlineCountry || "Australia";
  }

  // Migrate saves created before stopovers/waypoint chains existed.
  if (hadSave) {
    state.routes.forEach(r => {
      if (!r.waypoints) r.waypoints = [r.origin, r.dest];
      if (!r.legs) r.legs = buildRouteLegs(r.waypoints);
      if (r.schedule) r.schedule = normalizeRouteSchedule(r) || null;
      const assignedAircraft = state.fleet.find(f => f.fid === r.aircraftFid);
      const assignedType = assignedAircraft ? aircraftTypeById(assignedAircraft.typeId) : null;
      if (!Number.isFinite(r.plannedDurationMinutes)) r.plannedDurationMinutes = routeCircuitMinutes(r, assignedType);
      if (assignedType) r.ticketPrices = normalizedRouteTicketPrices(r, assignedType);
    });
    state.fleet.forEach(f => { if (f.legIndex === undefined) f.legIndex = 0; });
    if (!state.cheats) state.cheats = { unlocked: false, speedMultiplier: 1 };
  }
  if (!Number.isFinite(state.finance.totalFuelBurned)) state.finance.totalFuelBurned = 0;
  if (!Number.isFinite(state.finance.totalFuelCost)) state.finance.totalFuelCost = 0;
  if (!Number.isFinite(state.finance.maintenanceBudgetPerDay)) state.finance.maintenanceBudgetPerDay = 0;
  if (state.finance.maintenanceBudgetCustomized === undefined) state.finance.maintenanceBudgetCustomized = false;
  if (!Number.isFinite(state.finance.totalMaintenanceBudgetSpent)) state.finance.totalMaintenanceBudgetSpent = 0;
  if (!Number.isFinite(state.finance.totalScheduledMaintenanceCost)) state.finance.totalScheduledMaintenanceCost = 0;
  if (!Number.isFinite(state.finance.totalStaffWages)) state.finance.totalStaffWages = 0;
  if (!Number.isFinite(state.finance.karenCustomerIncidents)) state.finance.karenCustomerIncidents = 0;
  if (!Number.isFinite(state.finance.karenCustomerDelayMinutes)) state.finance.karenCustomerDelayMinutes = 0;
  if (!Number.isFinite(state.finance.totalCrashCosts)) state.finance.totalCrashCosts = 0;
  if (!Number.isFinite(state.finance.totalFuelLost)) state.finance.totalFuelLost = 0;
  if (!Number.isFinite(state.finance.crashes)) state.finance.crashes = 0;
  if (!Number.isFinite(state.finance.fatalities)) state.finance.fatalities = 0;
  if (!Array.isArray(state.finance.incidentHistory)) state.finance.incidentHistory = [];
  if (state.finance.activeLoan === undefined) state.finance.activeLoan = null;
  if (!Number.isFinite(state.finance.totalLoansBorrowed)) state.finance.totalLoansBorrowed = 0;
  if (!Number.isFinite(state.finance.totalLoansRepaid)) state.finance.totalLoansRepaid = 0;
  if (!Number.isFinite(state.finance.totalRouteOpeningCosts)) state.finance.totalRouteOpeningCosts = 0;
  if (!Number.isFinite(state.finance.totalAircraftSaleProceeds)) state.finance.totalAircraftSaleProceeds = 0;
  if (!state.liveries || typeof state.liveries !== "object") state.liveries = {};
  if (!Number.isFinite(state.lastSavedAt)) state.lastSavedAt = Date.now();
  state.fleet.forEach(ensureAircraftOperations);
  state.fleet.forEach(f => {
    if (["Flying", "Turnaround", "Maintenance"].includes(f.status) && !f.activeRouteId) f.activeRouteId = f.routeId;
    if (f.status === "Scheduled") setAircraftNextDeparture(f, state.gameMinutes, true);
  });

  const offlineSummary = hadOfflineTimestamp ? applyOfflineProgress() : null;

  initMap();
  wireStaticEvents();
  renderAll();
  restoreAccountSession();
  startSimLoop();
  maybeShowOnboarding();
  saveGame();

  if (offlineSummary && !offlineSummary.repossessed && state.setupComplete) {
    const awayHours = offlineSummary.simulatedMinutes / 60;
    const awayLabel = awayHours >= 24
      ? `${(awayHours / 24).toFixed(1)} days`
      : awayHours >= 1 ? `${awayHours.toFixed(1)} hours` : `${Math.round(offlineSummary.simulatedMinutes)} minutes`;
    showModal(`
      <h2>Welcome Back</h2>
      <p>Your airline continued operating for <b>${awayLabel}</b> at normal 1× speed while the game was closed.</p>
      <div class="map-popup-grid">
        <div><span>Revenue earned</span><b>${fmtMoney(offlineSummary.revenue)}</b></div>
        <div><span>Operating costs</span><b>${fmtMoney(offlineSummary.costs)}</b></div>
        <div><span>Net cash change</span><b class="${offlineSummary.cashChange >= 0 ? 'positive' : 'negative'}">${offlineSummary.cashChange >= 0 ? '+' : ''}${fmtMoney(offlineSummary.cashChange)}</b></div>
        <div><span>Passengers carried</span><b>${fmtNum(offlineSummary.passengers)}</b></div>
      </div>
      ${offlineSummary.wasCapped ? `<p class="empty-msg">Offline catch-up was capped at seven real days.</p>` : ""}
      <button class="btn btn-primary" onclick="closeModal()">Continue</button>
    `);
  }

  // Autosave periodically
  setInterval(saveGame, 15000);
}

/* ---- Onboarding: found your airline (name, code, country, starting airport) ---- */
function airlineCountryDisplayName(country) {
  return country === "United States" ? "United States of America" : country;
}

function populateOnboardingAirports() {
  const countryEl = document.getElementById("obCountry");
  const searchEl = document.getElementById("obAirportSearch");
  const airportEl = document.getElementById("obAirport");
  if (!countryEl || !searchEl || !airportEl) return;

  const country = countryEl.value;
  const query = searchEl.value.trim().toLowerCase();
  const previous = airportEl.value;
  let airports = country ? AIRPORTS.filter(a => a.country === country) : [];
  if (query) {
    airports = airports.filter(a => [
      a.iata, a.icao, a.name, a.city, a.country, airlineCountryDisplayName(a.country)
    ].some(value => String(value || "").toLowerCase().includes(query)));
  }
  airports.sort((a, b) => b.size - a.size || b.demand - a.demand || a.city.localeCompare(b.city));

  searchEl.disabled = !country;
  airportEl.disabled = !country;
  airportEl.innerHTML = `<option value="">${country ? (airports.length ? "Select starting airport…" : "No matching airports") : "Select a country first…"}</option>` +
    airports.map(a => `<option value="${a.iata}">${a.iata} / ${a.icao} — ${escapeHtml(a.name)}, ${escapeHtml(a.city)}</option>`).join("");
  if (airports.some(a => a.iata === previous)) airportEl.value = previous;
}

function maybeShowOnboarding() {
  const overlay = document.getElementById("onboardingOverlay");
  if (state.setupComplete) { overlay.classList.remove("visible"); return; }

  const countries = [...new Set(AIRPORTS.map(a => a.country))].sort();
  document.getElementById("onboardingBody").innerHTML = `
    <div class="onboarding-icon">✈</div>
    <h2>Found Your Airline</h2>
    <p>Give your airline a name, code, home country, and starting airport.</p>
    <div class="form-row">
      <label>Airline name</label>
      <input type="text" id="obName" placeholder="e.g. Skyline Airways" maxlength="30" value="${escapeHtml(state.airlineName || "")}" />
    </div>
    <div class="form-row">
      <label>Airline code</label>
      <input type="text" id="obCode" placeholder="e.g. SK" maxlength="3" />
    </div>
    <div class="form-row">
      <label>Home country</label>
      <select id="obCountry">
        <option value="">Select country…</option>
        ${countries.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(airlineCountryDisplayName(c))}</option>`).join("")}
      </select>
    </div>
    <div class="form-row">
      <label>Search for your starting airport</label>
      <input type="search" id="obAirportSearch" placeholder="Airport name, city, IATA, or ICAO…" disabled />
    </div>
    <div class="form-row">
      <label>Starting airport</label>
      <select id="obAirport" disabled>
        <option value="">Select a country first…</option>
      </select>
    </div>
    <p class="onboarding-error" id="obError" style="display:none;"></p>
    <button class="btn btn-primary" id="obSubmitBtn">Found Airline &amp; Start Flying</button>
  `;
  overlay.classList.add("visible");
  document.getElementById("obSubmitBtn").onclick = completeOnboarding;
  document.getElementById("obCode").onkeydown = (e) => { if (e.key === "Enter") completeOnboarding(); };
  document.getElementById("obCountry").onchange = () => {
    document.getElementById("obAirportSearch").value = "";
    populateOnboardingAirports();
  };
  document.getElementById("obAirportSearch").oninput = populateOnboardingAirports;
  populateOnboardingAirports();
}

function completeOnboarding() {
  const name = document.getElementById("obName").value.trim();
  const code = document.getElementById("obCode").value.trim().toUpperCase();
  const country = document.getElementById("obCountry").value;
  const airportIata = document.getElementById("obAirport").value;
  const errEl = document.getElementById("obError");

  if (!name || !code || !country || !airportIata) {
    errEl.textContent = "Please fill in every field and choose a starting airport.";
    errEl.style.display = "block";
    return;
  }
  if (!/^[A-Z0-9]{2,3}$/.test(code)) {
    errEl.textContent = "Airline code should be 2–3 letters or numbers (e.g. SK, QF, VA).";
    errEl.style.display = "block";
    return;
  }
  const startingAirport = airportByIata(airportIata);
  if (!startingAirport || startingAirport.country !== country) {
    errEl.textContent = "Please choose an airport in your selected home country.";
    errEl.style.display = "block";
    return;
  }

  state.airlineName = name;
  state.airlineCode = code;
  state.airlineCountry = country;
  if (!state.hubs.includes(airportIata)) state.hubs.unshift(airportIata);
  routeForm.origin = airportIata;
  state.setupComplete = true;
  document.getElementById("onboardingOverlay").classList.remove("visible");
  refreshHubMarkers();
  renderTopBar();
  if (currentScreen === "airline") renderAirline();
  saveGame();
  toast(`${name} (${code}) is ready at ${airportIata}!`);
}

function wireStaticEvents() {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.onclick = () => switchScreen(btn.dataset.screen);
  });
  document.getElementById("modalCloseBtn").onclick = closeModal;
  document.getElementById("modalOverlay").onclick = (e) => { if (e.target.id === "modalOverlay") closeModal(); };
  document.getElementById("mapSheetCloseBtn").onclick = closeMapSheet;
}

document.addEventListener("DOMContentLoaded", init);
