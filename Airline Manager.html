/* -------------------------------------------------------------------------
   3. ECONOMY CALCULATIONS
   ------------------------------------------------------------------------- */

const CABIN_CLASS_META = {
  economy: { label: "Economy", multiplier: 1 },
  premiumEconomy: { label: "Premium Economy", multiplier: 1.45 },
  business: { label: "Business", multiplier: 2.6 },
  first: { label: "First Class", multiplier: 4.5 }
};

function availableCabinClasses(type) {
  if (!type) return ["economy"];
  if (type.capacity <= 80) return ["economy"];
  if (type.category === "Regional" || type.category === "Narrowbody") return ["economy", "business"];
  return ["economy", "premiumEconomy", "business", "first"];
}

function cabinSeatShares(classes) {
  if (classes.length === 1) return { economy: 1 };
  if (classes.length === 2) return { economy: 0.88, business: 0.12 };
  return { economy: 0.68, premiumEconomy: 0.16, business: 0.12, first: 0.04 };
}

function baseEconomyFare(distance) {
  return Math.round(55 + distance * 0.145);
}

function defaultTicketPrices(distance, type) {
  const economy = baseEconomyFare(distance);
  const prices = {};
  availableCabinClasses(type).forEach(classId => {
    prices[classId] = Math.round(economy * CABIN_CLASS_META[classId].multiplier);
  });
  return prices;
}

function defaultRouteTicketPrices(legs, type) {
  const averageDistance = legs.length ? legs.reduce((sum, leg) => sum + leg.distance, 0) / legs.length : 0;
  return defaultTicketPrices(averageDistance, type);
}

function normalizedRouteTicketPrices(route, type) {
  const defaults = defaultRouteTicketPrices(route.legs || [], type);
  const prices = {};
  availableCabinClasses(type).forEach(classId => {
    const saved = Number(route.ticketPrices?.[classId]);
    prices[classId] = Number.isFinite(saved) && saved > 0 ? Math.round(saved) : defaults[classId];
  });
  return prices;
}

// Estimate route economics for a given origin/dest/aircraft type
function computeRouteEstimate(originIata, destIata, typeId, ticketPrices = null) {
  const origin = airportByIata(originIata);
  const dest = airportByIata(destIata);
  if (!origin || !dest) return null;
  const distance = greatCircleDistance(origin.lat, origin.lon, dest.lat, dest.lon);
  const type = typeId ? aircraftTypeById(typeId) : null;

  // Base demand pool for the route (geometric mean of endpoint demand, decays with distance)
  const rawDemand = Math.sqrt(origin.demand * dest.demand);
  const distanceDecay = 1 / (1 + distance / 9000);
  const hubBonus = 1 + (state.hubs.includes(originIata) ? 0.15 : 0) + (state.hubs.includes(destIata) ? 0.1 : 0);
  const demandPerFlight = rawDemand * distanceDecay * hubBonus;

  const ticketPrice = baseEconomyFare(distance);
  const capacity = type ? type.capacity : 180;
  const loadFactor = Math.min(0.96, Math.max(0.35, demandPerFlight / capacity));
  const classes = availableCabinClasses(type);
  const shares = cabinSeatShares(classes);
  const defaults = defaultTicketPrices(distance, type);
  const cabinBreakdown = classes.map(classId => {
    const seats = Math.max(1, Math.round(capacity * shares[classId]));
    const price = Math.max(1, Number(ticketPrices?.[classId]) || defaults[classId]);
    const priceRatio = price / defaults[classId];
    const classLoadFactor = Math.min(0.98, Math.max(0.12, loadFactor * Math.pow(priceRatio, -1.35)));
    const classPassengers = Math.min(seats, Math.round(seats * classLoadFactor));
    return { classId, label: CABIN_CLASS_META[classId].label, seats, price, loadFactor: classLoadFactor, passengers: classPassengers, revenue: classPassengers * price };
  });
  const passengers = cabinBreakdown.reduce((sum, cabin) => sum + cabin.passengers, 0);
  const revenue = cabinBreakdown.reduce((sum, cabin) => sum + cabin.revenue, 0);

  let flightHours = null, opCost = 0, maintCost = 0, airportFee = 0, fuelCost = 0;
  if (type) {
    flightHours = distance / type.speed;
    opCost = distance * type.opCostPerKm;
    maintCost = flightHours * type.maintPerHour;
    airportFee = dest.size * 1800;
    fuelCost = flightHours * type.fuelBurn * 1000 * FUEL_PRICE_PER_KG;
  }
  const cost = opCost + maintCost + airportFee + fuelCost;
  const profit = type ? (revenue - cost) : null;

  return {
    distance, ticketPrice, ticketPrices: Object.fromEntries(cabinBreakdown.map(cabin => [cabin.classId, cabin.price])), cabinBreakdown, capacity, loadFactor, passengers, revenue,
    opCost, maintCost, airportFee, fuelCost, cost, profit, flightHours,
    inRange: type ? distance <= type.range : null
  };
}

function recommendedMaintenanceBudget() {
  // Four maintenance labour-equivalent hours per aircraft per day, scaled by type.
  return state.fleet.reduce((total, f) => {
    const type = aircraftTypeById(f.typeId);
    return total + (type ? type.maintPerHour * 4 : 0);
  }, 0);
}

function currentMaintenanceBudget() {
  if (!state.finance.maintenanceBudgetCustomized) return recommendedMaintenanceBudget();
  return Math.max(0, Number(state.finance.maintenanceBudgetPerDay) || 0);
}

function maintenanceSafetyRatio() {
  const recommended = recommendedMaintenanceBudget();
  return recommended > 0 ? currentMaintenanceBudget() / recommended : 1;
}

function crashChancePerFlight(f = null) {
  const shortfall = Math.max(0, 1 - Math.min(1, maintenanceSafetyRatio()));
  const conditionShortfall = f ? Math.max(0, (85 - (f.conditionPct ?? 100)) / 85) : 0;
  // Poor maintenance funding and badly worn aircraft both increase risk.
  return Math.min(0.05, 0.000001 + Math.pow(shortfall, 3) * 0.02 + Math.pow(conditionShortfall, 2) * 0.025);
}

function formatRiskPercent(probability) {
  const percent = probability * 100;
  return percent < 0.001 ? "<0.001%" : `${percent.toFixed(3)}%`;
}

function routeOpeningCost(distance, type) {
  if (!type) return 5000000;
  const distanceFactor = Math.max(0, Math.min(1, distance / 15000));
  const aircraftFactor = Math.max(0, Math.min(1, (type.capacity - 70) / (555 - 70)));
  const blendedFactor = distanceFactor * 0.7 + aircraftFactor * 0.3;
  return Math.round((5000000 + blendedFactor * 10000000) / 10000) * 10000;
}

function takeLoan(amount) {
  if (state.finance.activeLoan) return false;
  amount = Math.round(Number(amount));
  if (!Number.isFinite(amount) || amount <= 0) return false;
  const day = Math.floor(state.gameMinutes / 1440);
  state.finance.activeLoan = { principal: amount, borrowedDay: day, dueDay: day + 7, graceUsed: false };
  state.finance.totalLoansBorrowed += amount;
  state.cash += amount;
  return true;
}

function repayActiveLoan() {
  const loan = state.finance.activeLoan;
  if (!loan || state.cash < loan.principal) return false;
  state.cash -= loan.principal;
  state.finance.totalLoansRepaid += loan.principal;
  state.finance.activeLoan = null;
  return true;
}

function processLoanDeadline(day) {
  const loan = state.finance.activeLoan;
  if (!loan || day < loan.dueDay) return false;
  if (!loan.graceUsed) {
    loan.graceUsed = true;
    loan.dueDay += 7;
    if (day < loan.dueDay) {
      if (map) showModal(`
        <h2>Loan Overdue — Final Notice</h2>
        <p>Your ${fmtMoney(loan.principal)} loan was not repaid. You have received one final seven-day extension.</p>
        <p class="negative"><b>Pay by game day ${loan.dueDay}, or your airline will be repossessed.</b></p>
        <button class="btn btn-primary" onclick="closeModal()">Acknowledge</button>
      `);
      return false;
    }
  }

  resetGame();
  toast("Your unpaid loan defaulted. The airline was repossessed — start again.");
  return true;
}

function hubDailyFee(iata) {
  const a = airportByIata(iata);
  return a ? a.size * 6000 : 0;
}

/* -------------------------------------------------------------------------
   4. MAP SETUP & RENDERING (Leaflet + OpenStreetMap — no API key needed)
   ------------------------------------------------------------------------- */
let map = null;
let canvasRenderer = null;
let airportMarkers = {};     // iata -> one marker, repositioned to the visible world copy
let routeLines = {};         // rid -> { line, path }
let aircraftMarkers = {};    // fid -> marker
let selectedAirportIata = null;
let tileLayer = null;

// Standard OpenStreetMap tiles — the most reliable free/keyless raster source.
// (Wikimedia's "international" style has nicer English labels but restricts
// embedding outside Wikimedia sites, so it wasn't loading reliably.)
const OSM_TILE_URL = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";
const OSM_TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

function sizeColor(size) {
  return ["#5b6b85", "#5b6b85", "#3b82f6", "#0ea5e9", "#f59e42", "#ef4444"][size] || "#5b6b85";
}

// Classic map-pin (teardrop) SVG, point at the bottom, colored fill.
function pinIcon(color, big) {
  const w = big ? 30 : 22, h = big ? 42 : 30;
  const svg = `<svg width="${w}" height="${h}" viewBox="0 0 24 34" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 22 12 22s12-13 12-22c0-6.6-5.4-12-12-12z" fill="${color}" stroke="#1a1206" stroke-width="1"/>
    <circle cx="12" cy="12" r="5" fill="#1a1206" fill-opacity="0.55"/>
  </svg>`;
  return L.divIcon({ html: svg, className: "pin-icon", iconSize: [w, h], iconAnchor: [w / 2, h] });
}

function initMap() {
  map = L.map("map", {
    worldCopyJump: true,
    zoomControl: false,
    minZoom: 2,
    maxZoom: 19,
    zoomSnap: 0.25,       // allow fractional zoom levels for a smoother scroll/pinch feel
    zoomDelta: 0.5,
    wheelPxPerZoomLevel: 100,
  }).setView([20, 40], 3);

  // Single reliable, keyless tile source (good land/water contrast).
  // Dark mode is achieved with a CSS colour filter on the tile pane only,
  // which preserves that contrast instead of flattening it like most "dark" tile sets do.
  tileLayer = L.tileLayer(OSM_TILE_URL, {
    attribution: OSM_TILE_ATTR,
    subdomains: "abc",
    maxZoom: 19,
  }).addTo(map);

  applyMapTheme(!!(state.settings && state.settings.darkMap));

  map.on("zoomend", updateAirportMarkerVisibility);
  map.on("move", updateWrappedOverlayPositions);
  map.on("click", () => { if (!mapRoutePlanner.active) closeMapSheet(); });

  L.control.zoom({ position: "bottomright" }).addTo(map);
  canvasRenderer = L.canvas({ padding: 0.5 });

  initMapLayers();
}

function applyMapTheme(dark) {
  document.getElementById("app").classList.toggle("map-dark", dark);
}

function setMapTheme(dark) {
  state.settings.darkMap = dark;
  applyMapTheme(dark);
  saveGame();
}

// Minimum zoom level at which an airport of this size category starts showing its pin.
// Major/mega hubs are visible from the start; smaller fields reveal themselves as you zoom in.
function airportMinZoom(size) {
  return { 5: 0, 4: 3, 3: 4, 2: 5, 1: 6 }[size] ?? 6;
}

function makeAirportMarker(a) {
  const owned = state.hubs.includes(a.iata);
  const marker = L.marker([a.lat, a.lon], {
    icon: pinIcon(owned ? "#f5b942" : sizeColor(a.size), owned),
  });
  marker.on("click", () => {
    if (mapRoutePlanner.active) selectMapRouteAirport(a.iata);
    else showMapSheet(buildAirportPopupHtml(a.iata));
  });
  marker.bindTooltip(`${a.iata} · ${a.city}`, { direction: "top", opacity: 0.9 });
  return marker;
}

function initMapLayers() {
  if (!map) return;
  Object.values(airportMarkers).forEach(m => map.removeLayer(m));
  Object.values(routeLines).forEach(l => map.removeLayer(l.line));
  Object.values(aircraftMarkers).forEach(m => map.removeLayer(m));
  airportMarkers = {}; routeLines = {}; aircraftMarkers = {};

  AIRPORTS.forEach(a => { airportMarkers[a.iata] = makeAirportMarker(a); });
  updateAirportMarkerVisibility();

  state.routes.forEach(r => drawRouteLine(r));
  state.fleet.forEach(f => { if (["Flying", "Assigned", "Turnaround", "Scheduled", "Maintenance"].includes(f.status)) ensureAircraftMarker(f); });
  updateWrappedOverlayPositions();
}

// Adds/removes airport pins from the map based on current zoom so smaller
// airports only appear once you've zoomed in — keeps the map readable and
// the marker count low at the default world view.
function updateAirportMarkerVisibility() {
  if (!map) return;
  const zoom = map.getZoom();
  AIRPORTS.forEach(a => {
    const marker = airportMarkers[a.iata];
    if (!marker) return;
    const owned = state.hubs.includes(a.iata);
    const shouldShow = owned || zoom >= airportMinZoom(a.size);
    const isShown = map.hasLayer(marker);
    if (shouldShow && !isShown) marker.addTo(map);
    else if (!shouldShow && isShown) map.removeLayer(marker);
  });
}

function refreshHubMarkers() {
  if (!map) return;
  AIRPORTS.forEach(a => {
    const marker = airportMarkers[a.iata];
    if (!marker) return;
    const owned = state.hubs.includes(a.iata);
    marker.setIcon(pinIcon(owned ? "#f5b942" : sizeColor(a.size), owned));
  });
  updateAirportMarkerVisibility();
}

function routeColor(route) {
  if (!route.stats.flights) return "#7aa7c9";
  return route.stats.lastProfit >= 0 ? "#4ade80" : "#f87171";
}

// Builds the physical legs (great-circle distance per hop) for a chain of
// waypoint IATA codes, e.g. [origin, stopover, dest] or just [origin, dest].
function buildRouteLegs(waypoints) {
  const legs = [];
  for (let i = 0; i < waypoints.length - 1; i++) {
    const o = airportByIata(waypoints[i]), d = airportByIata(waypoints[i + 1]);
    if (!o || !d) continue;
    legs.push({ from: waypoints[i], to: waypoints[i + 1], distance: greatCircleDistance(o.lat, o.lon, d.lat, d.lon) });
  }
  return legs;
}

function drawRouteLine(route) {
  if (!map) return;
  const wps = route.waypoints.map(iata => airportByIata(iata));
  if (wps.some(w => !w)) return;
  let fullPath = [];
  for (let i = 0; i < wps.length - 1; i++) {
    const seg = buildGreatCirclePath(wps[i].lat, wps[i].lon, wps[i + 1].lat, wps[i + 1].lon, 60);
    if (fullPath.length && seg.length) {
      const previousLon = fullPath[fullPath.length - 1][1];
      const offset = unwrapLongitude(seg[0][1], previousLon) - seg[0][1];
      if (offset) seg.forEach(point => { point[1] += offset; });
    }
    if (i > 0) seg.shift(); // avoid a duplicate point at the stopover junction
    fullPath = fullPath.concat(seg);
  }
  const line = L.polyline(fullPath, {
    renderer: canvasRenderer,
    color: routeColor(route),
    weight: 3,
    opacity: 0.85,
  }).addTo(map);
  line.on("click", () => showMapSheet(buildRoutePopupHtml(route.rid)));
  routeLines[route.rid] = {
    line,
    path: fullPath,
    centerLon: (fullPath[0][1] + fullPath[fullPath.length - 1][1]) / 2,
    worldOffset: 0
  };
  updateWrappedOverlayPositions();
}

function updateRouteLineColor(route) {
  const entry = routeLines[route.rid];
  if (entry) entry.line.setStyle({ color: routeColor(route) });
}

function removeRouteLine(rid) {
  if (routeLines[rid]) { map.removeLayer(routeLines[rid].line); delete routeLines[rid]; }
}

function planeIcon(heading, color, type) {
  // Smooth top-down airliner profiles. Larger aircraft get a broader
  // fuselage, wider wings and a larger on-map footprint.
  const profiles = {
    Regional:   { size: 24, body: 2.5, wingInset: 8, tail: 11 },
    Narrowbody: { size: 29, body: 3.2, wingInset: 5, tail: 13 },
    Widebody:   { size: 36, body: 4.3, wingInset: 2, tail: 15 },
    "Very Large": { size: 41, body: 5.2, wingInset: 1, tail: 17 }
  };
  const p = profiles[type && type.category] || profiles.Narrowbody;
  const cx = 32;
  const left = cx - p.body, right = cx + p.body;
  const leftWing = p.wingInset, rightWing = 64 - p.wingInset;
  const leftTail = cx - p.tail, rightTail = cx + p.tail;
  const bodyPath = `M32 2
    C35.5 4.8 ${right} 11 ${right} 23
    L${rightWing} 37 C${rightWing + 1.5} 38.5 ${rightWing + 1} 41 ${rightWing - 1} 42
    L${right} 36 L${right - 0.8} 50 L${rightTail} 57
    C${rightTail + 1.2} 58 ${rightTail + 0.8} 60 ${rightTail - 0.5} 61
    L33.2 57.2 L33 61 C33 62.3 31 62.3 31 61 L30.8 57.2
    L${leftTail + 0.5} 61 C${leftTail - 0.8} 60 ${leftTail - 1.2} 58 ${leftTail} 57
    L${left + 0.8} 50 L${left} 36 L${leftWing + 1} 42
    C${leftWing - 1} 41 ${leftWing - 1.5} 38.5 ${leftWing} 37 L${left} 23
    C${left} 11 28.5 4.8 32 2 Z`;

  const svg = `<svg width="${p.size}" height="${p.size}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"
      style="display:block;transform:rotate(${heading}deg);transform-origin:50% 50%;filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.65));">
    <path d="${bodyPath}" fill="${color}" stroke="#211805" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M32 5 C31.2 18 31.3 42 32 56" fill="none" stroke="#fff6d5" stroke-width="1.2" stroke-linecap="round" opacity=".42"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: "plane-icon",
    iconSize: [p.size, p.size],
    iconAnchor: [p.size / 2, p.size / 2]
  });
}

function ensureAircraftMarker(f) {
  if (!map) return null;
  if (aircraftMarkers[f.fid]) return aircraftMarkers[f.fid];
  const displayLon = unwrapLongitude(f.lon || 0, map.getCenter().lng);
  const type = aircraftTypeById(f.typeId);
  const marker = L.marker([f.lat || 0, displayLon], {
    icon: planeIcon(0, "#f5b942", type),
    interactive: true,
    bubblingMouseEvents: false,
    zIndexOffset: 1000,
  }).addTo(map);
  marker.on("click", () => showMapSheet(buildAircraftPopupHtml(f.fid)));
  marker._aircraftIconTypeId = f.typeId;
  aircraftMarkers[f.fid] = marker;
  return marker;
}

function removeAircraftMarker(fid) {
  if (aircraftMarkers[fid]) { map.removeLayer(aircraftMarkers[fid]); delete aircraftMarkers[fid]; }
}

// Leaflet repeats its tile layer horizontally, but vector overlays and
// markers are single objects. Move those existing objects to whichever world
// copy is closest to the current map centre. This keeps panning seamless
// without cloning, deleting, or recreating pins, routes, or aircraft.
function updateWrappedOverlayPositions() {
  if (!map) return;
  const centerLon = map.getCenter().lng;

  AIRPORTS.forEach(a => {
    const marker = airportMarkers[a.iata];
    if (!marker) return;
    const displayLon = unwrapLongitude(a.lon, centerLon);
    if (marker.getLatLng().lng !== displayLon) marker.setLatLng([a.lat, displayLon]);
  });

  Object.values(routeLines).forEach(entry => {
    const offset = Math.round((centerLon - entry.centerLon) / 360) * 360;
    if (entry.worldOffset === offset) return;
    entry.worldOffset = offset;
    entry.line.setLatLngs(entry.path.map(([lat, lon]) => [lat, lon + offset]));
  });

  state.fleet.forEach(f => {
    const marker = aircraftMarkers[f.fid];
    if (!marker) return;
    marker.setLatLng([f.lat, unwrapLongitude(f.lon, centerLon)]);
  });
}

/* -------------------------------------------------------------------------
   5. AIRCRAFT SIMULATION LOOP
   ------------------------------------------------------------------------- */
// 1x = real-time (1 real minute = 1 game minute). Movement is driven by
// requestAnimationFrame using actual elapsed real time each frame (not a
// fixed 1-second step), so aircraft glide smoothly even at high cheat speed
// multipliers instead of jumping in big, jittery increments.
let simLoopStarted = false;
let lastFrameTime = null;
let uiUpdateAccumulatorMs = 0;
const UI_UPDATE_INTERVAL_MS = 400; // top bar / finance chart refresh cadence — doesn't need 60fps

function startSimLoop() {
  if (simLoopStarted) return;
  simLoopStarted = true;
  lastFrameTime = null;
  requestAnimationFrame(animationLoop);
}

function animationLoop(now) {
  requestAnimationFrame(animationLoop);
  if (lastFrameTime === null) { lastFrameTime = now; return; }
  let deltaMs = now - lastFrameTime;
  lastFrameTime = now;
  // Guard against huge jumps (e.g. the tab was backgrounded and just resumed).
  if (deltaMs > 1000) deltaMs = 1000;

  if (state.settings.paused) return;

  const speedMultiplier = (state.cheats && state.cheats.speedMultiplier) || 1;
  const minutesThisFrame = (deltaMs / 60000) * speedMultiplier;
  state.gameMinutes += minutesThisFrame;

  // Day boundary check (1 day = 1440 game-minutes)
  const currentDay = Math.floor(state.gameMinutes / 1440);
  if (currentDay > state.lastDayCharged) {
    if (chargeDailyFees(currentDay - state.lastDayCharged)) return;
    state.lastDayCharged = currentDay;
  }

  state.fleet.slice().forEach(f => {
    const route = aircraftSimulationRoute(f, state.gameMinutes - minutesThisFrame);
    if (route) advanceAircraft(f, route, minutesThisFrame);
  });

  if (currentScreen === "map") renderMapAircraftPositions();

  uiUpdateAccumulatorMs += deltaMs;
  if (uiUpdateAccumulatorMs >= UI_UPDATE_INTERVAL_MS) {
    uiUpdateAccumulatorMs = 0;
    renderTopBar();
    if (currentScreen === "operations") renderOperations();
    if (currentScreen === "finances" && currentDay > state.lastRenderedFinDay) {
      renderFinances();
      state.lastRenderedFinDay = currentDay;
    }
  }
}

// Returns the physical leg an aircraft is currently flying (with correct
// from/to direction), accounting for a possible stopover and the outbound/
// return direction of travel around the route's waypoint chain.
function getCurrentPhysicalLeg(f, route) {
  const legs = route.legs;
  if (f.dir === "out") {
    const leg = legs[f.legIndex];
    return { from: leg.from, to: leg.to, distance: leg.distance };
  } else {
    const leg = legs[legs.length - 1 - f.legIndex];
    return { from: leg.to, to: leg.from, distance: leg.distance };
  }
}

function advanceAircraft(f, route, minutes) {
  const type = aircraftTypeById(f.typeId);
  ensureAircraftOperations(f);
  if (f.legIndex === undefined) f.legIndex = 0;
  let remainingMinutes = minutes;

  if (f.status === "Maintenance") {
    const used = Math.min(remainingMinutes, f.maintenanceMinutes);
    f.maintenanceMinutes -= used;
    remainingMinutes -= used;
    if (f.maintenanceMinutes > 0) return;
    f.conditionPct = 100;
    f.flightHoursSinceMaintenance = 0;
    f.maintenanceMinutes = 0;
    if (route.schedule) setAircraftNextDeparture(f, state.gameMinutes - remainingMinutes, true);
    else f.status = "Flying";
    if (f.status === "Scheduled" && f.nextDepartureRouteId !== route.rid) return;
    if (remainingMinutes <= 0) return;
  }

  if (f.status === "Scheduled") {
    const frameStart = state.gameMinutes - remainingMinutes;
    if (!Number.isFinite(f.nextDepartureGameMinute)) {
      f.nextDepartureGameMinute = nextScheduledDeparture(route, frameStart, true);
    }
    if (!Number.isFinite(f.nextDepartureGameMinute) || f.nextDepartureGameMinute > state.gameMinutes) return;
    remainingMinutes = Math.max(0, state.gameMinutes - Math.max(frameStart, f.nextDepartureGameMinute));
    f.nextDepartureGameMinute = null;
    f.nextDepartureRouteId = null;
    f.activeRouteId = route.rid;
    f.routeId = route.rid;
    f.status = "Flying";
    f.dir = "out";
    f.legIndex = 0;
    f.progress = 0;
    if (remainingMinutes <= 0) return;
  }

  // Aircraft remain parked for 60–120 simulated minutes after every leg.
  // Cleaning and passenger handling happen during this period; fuel was purchased on arrival.
  if (f.turnaroundMinutes > 0) {
    const groundMinutes = Math.min(remainingMinutes, f.turnaroundMinutes);
    f.turnaroundMinutes -= groundMinutes;
    remainingMinutes -= groundMinutes;
    if (f.turnaroundMinutes > 0) return;
    f.turnaroundMinutes = 0;
    f.turnaroundIata = null;
    f.turnaroundReason = null;
    f.karenDelayMinutes = 0;
    if (f.returnedToOriginPending && route.schedule) {
      f.returnedToOriginPending = false;
      if (aircraftNeedsScheduledMaintenance(f)) {
        beginScheduledMaintenance(f, route);
      } else {
        setAircraftNextDeparture(f, state.gameMinutes - remainingMinutes, true);
      }
      if (f.status !== "Flying") return;
    } else {
      f.returnedToOriginPending = false;
      f.status = "Flying";
    }
    if (remainingMinutes <= 0) return;
  }

  const cur = getCurrentPhysicalLeg(f, route);
  const flightMinutes = (cur.distance / type.speed) * 60;
  const minutesToArrival = Math.max(0, (1 - f.progress) * flightMinutes);
  const flyingMinutes = Math.min(remainingMinutes, minutesToArrival);

  const requestedFuelBurn = type.fuelBurn * 1000 * (flyingMinutes / 60);
  const actualFuelBurn = Math.min(f.fuelKg, requestedFuelBurn);
  f.fuelKg -= actualFuelBurn;
  f.fuelUsedKg += actualFuelBurn;
  state.finance.totalFuelBurned += actualFuelBurn;
  const flightHours = flyingMinutes / 60;
  f.flightHoursSinceMaintenance += flightHours;
  const fundingWear = 1 + Math.max(0, 1 - Math.min(1, maintenanceSafetyRatio())) * 0.75;
  f.conditionPct = Math.max(0, f.conditionPct - flightHours * 0.12 * fundingWear);
  f.progress += flyingMinutes / flightMinutes;

  if (f.progress >= 0.999999) {
    if (maybeCrashAircraft(f, route, cur)) return;
    const arrival = airportByIata(cur.to);
    f.lat = arrival.lat;
    f.lon = unwrapLongitude(arrival.lon, Number.isFinite(f.lon) ? f.lon : arrival.lon);
    completeLegSegment(f, route, cur);
    refuelAircraft(f, route);
    f.progress = 0;
    f.legIndex += 1;
    const returnedToOrigin = f.dir === "back" && f.legIndex >= route.legs.length;
    if (f.legIndex >= route.legs.length) {
      // Reached the end of the chain in this direction — turn around.
      f.dir = f.dir === "out" ? "back" : "out";
      f.legIndex = 0;
    }
    f.returnedToOriginPending = returnedToOrigin;
    f.status = "Turnaround";
    f.turnaroundIata = cur.to;
    const standardTurnaround = 60 + Math.random() * 60;
    const hasKarenCustomer = Math.random() < KAREN_CUSTOMER_CHANCE;
    f.karenDelayMinutes = hasKarenCustomer ? 20 + Math.random() * 40 : 0;
    f.turnaroundMinutes = standardTurnaround + f.karenDelayMinutes;
    f.turnaroundReason = hasKarenCustomer
      ? `Karen customer incident (+${Math.round(f.karenDelayMinutes)} min)`
      : "Cleaning and passenger handling";
    f.lastTurnaroundDuration = f.turnaroundMinutes;
    if (hasKarenCustomer) {
      state.finance.karenCustomerIncidents += 1;
      state.finance.karenCustomerDelayMinutes += f.karenDelayMinutes;
      route.stats.karenCustomerIncidents = (route.stats.karenCustomerIncidents || 0) + 1;
      route.stats.karenCustomerDelayMinutes = (route.stats.karenCustomerDelayMinutes || 0) + f.karenDelayMinutes;
    }
    return;
  }

  const o = airportByIata(cur.from), d = airportByIata(cur.to);
  let [lat, lon] = greatCircleInterpolate(o.lat, o.lon, d.lat, d.lon, Math.min(f.progress, 0.999));
  lon = unwrapLongitude(lon, Number.isFinite(f.lon) ? f.lon : o.lon);
  f.lat = lat; f.lon = lon;

  const nextPt = greatCircleInterpolate(o.lat, o.lon, d.lat, d.lon, Math.min(f.progress + 0.01, 1));
  f.heading = bearing(lat, lon, nextPt[0], nextPt[1]);
}

function completeLegSegment(f, route, leg) {
  const type = aircraftTypeById(f.typeId);
  const fares = normalizedRouteTicketPrices(route, type);
  const est = computeRouteEstimate(leg.from, leg.to, f.typeId, fares);
  // Add small randomness to load factor per flight for variety
  const variance = 0.85 + Math.random() * 0.3;
  const cabinResults = est.cabinBreakdown.map(cabin => {
    const passengers = Math.max(0, Math.round(Math.min(cabin.seats, cabin.passengers * variance)));
    return { ...cabin, passengers, revenue: passengers * cabin.price };
  });
  const passengers = cabinResults.reduce((sum, cabin) => sum + cabin.passengers, 0);
  const revenue = cabinResults.reduce((sum, cabin) => sum + cabin.revenue, 0);
  // Fuel is charged from the exact amount bought on arrival, not from the estimate.
  const cost = est.cost - est.fuelCost;
  const profit = revenue - cost;

  state.cash += profit;
  f.profitGenerated += profit;

  route.stats.flights += 1;
  route.stats.revenue += revenue;
  route.stats.cost += cost;
  route.stats.profit += profit;
  route.stats.passengers += passengers;
  route.stats.lastRevenue = revenue;
  route.stats.lastCost = cost;
  route.stats.lastProfit = profit;
  route.stats.lastCabinResults = Object.fromEntries(cabinResults.map(cabin => [cabin.classId, { passengers: cabin.passengers, revenue: cabin.revenue, price: cabin.price }]));

  state.finance.totalRevenue += revenue;
  state.finance.totalCost += cost;
  state.finance.totalProfit += profit;
  state.finance.totalPassengers += passengers;

  updateRouteLineColor(route);
}

function aircraftNeedsScheduledMaintenance(f) {
  return f.flightHoursSinceMaintenance >= SCHEDULED_MAINTENANCE_HOURS || f.conditionPct <= 85;
}

function beginScheduledMaintenance(f, route) {
  const type = aircraftTypeById(f.typeId);
  const cost = Math.round(type.maintPerHour * 10);
  f.status = "Maintenance";
  f.maintenanceMinutes = 360 + Math.random() * 360;
  state.cash -= cost;
  state.finance.totalCost += cost;
  state.finance.totalProfit -= cost;
  state.finance.totalScheduledMaintenanceCost += cost;
  route.stats.cost += cost;
  route.stats.profit -= cost;
  route.stats.lastCost += cost;
  route.stats.lastProfit -= cost;
  f.profitGenerated -= cost;
}

function maybeCrashAircraft(f, route, leg) {
  const probability = crashChancePerFlight(f);
  if (Math.random() >= probability) return false;

  const type = aircraftTypeById(f.typeId);
  const est = computeRouteEstimate(leg.from, leg.to, f.typeId);
  const passengerFatalities = Math.max(1, Math.round(est.passengers * (0.85 + Math.random() * 0.15)));
  const fatalities = passengerFatalities + 3; // two pilots and one cabin crew member
  const legalCost = 40000000 + fatalities * 1250000;
  const fuelLost = Math.max(0, f.fuelKg || 0);
  const incident = {
    day: Math.floor(state.gameMinutes / 1440),
    registration: f.reg,
    aircraft: type.name,
    route: `${leg.from} → ${leg.to}`,
    fatalities,
    legalCost,
    fuelLost
  };

  state.cash -= legalCost;
  state.finance.totalCost += legalCost;
  state.finance.totalProfit -= legalCost;
  state.finance.totalCrashCosts += legalCost;
  state.finance.totalFuelLost += fuelLost;
  state.finance.crashes += 1;
  state.finance.fatalities += fatalities;
  state.finance.incidentHistory.unshift(incident);
  if (state.finance.incidentHistory.length > 20) state.finance.incidentHistory.length = 20;

  const lostRouteIds = state.routes.filter(x => x.aircraftFid === f.fid).map(x => x.rid);
  state.fleet = state.fleet.filter(x => x.fid !== f.fid);
  state.routes = state.routes.filter(x => x.aircraftFid !== f.fid);

  if (map) {
    lostRouteIds.forEach(removeRouteLine);
    removeAircraftMarker(f.fid);
    closeMapSheet();
    renderTopBar();
    if (currentScreen === "fleet") renderFleet();
    if (currentScreen === "operations") renderOperations();
    if (currentScreen === "routes") renderRoutes();
    if (currentScreen === "finances") renderFinances();
    showModal(`
      <h2>Aircraft Accident</h2>
      <p><b>${f.reg}</b>, a ${type.name}, crashed while operating ${leg.from} → ${leg.to}.</p>
      <div class="map-popup-grid">
        <div><span>Fatalities</span><b>${fmtNum(fatalities)}</b></div>
        <div><span>Legal &amp; compensation costs</span><b>${fmtMoney(legalCost)}</b></div>
        <div><span>Fuel lost</span><b>${fmtFuel(fuelLost)}</b></div>
        <div><span>Aircraft</span><b>Written off</b></div>
      </div>
      <p class="empty-msg">The aircraft and all routes assigned to it have been removed from your airline.</p>
      <button class="btn btn-primary" onclick="closeModal()">Acknowledge</button>
    `);
  }
  saveGame();
  return true;
}

function chargeDailyFees(numDays) {
  let hubFees = 0;
  state.hubs.forEach(iata => { hubFees += hubDailyFee(iata) * numDays; });
  const maintenanceSpend = currentMaintenanceBudget() * numDays;
  const staffWages = dailyStaffWages() * numDays;
  const totalFee = hubFees + maintenanceSpend + staffWages;
  state.cash -= totalFee;
  state.finance.totalCost += totalFee;
  state.finance.totalProfit -= totalFee;
  state.finance.totalMaintenanceBudgetSpent += maintenanceSpend;
  state.finance.totalStaffWages += staffWages;

  const day = Math.floor(state.gameMinutes / 1440);
  state.finance.history.push({
    day,
    cash: state.cash,
    revenue: state.finance.totalRevenue,
    cost: state.finance.totalCost,
    profit: state.finance.totalProfit
  });
  if (state.finance.history.length > 200) state.finance.history.shift();
  if (processLoanDeadline(day)) return true;
  saveGame();
  return false;
}

function applyOfflineProgress() {
  if (!Number.isFinite(state.lastSavedAt) || state.settings.paused) return null;
  const elapsedRealMinutes = Math.max(0, (Date.now() - state.lastSavedAt) / 60000);
  if (elapsedRealMinutes < 1) return null;

  // Offline play always runs at normal 1× speed. Limit one catch-up to seven real days.
  const simulatedMinutes = Math.min(elapsedRealMinutes, 7 * 24 * 60);
  const before = {
    cash: state.cash,
    revenue: state.finance.totalRevenue,
    cost: state.finance.totalCost,
    passengers: state.finance.totalPassengers
  };
  let remaining = simulatedMinutes;

  while (remaining > 0) {
    const step = Math.min(5, remaining);
    state.gameMinutes += step;
    const currentDay = Math.floor(state.gameMinutes / 1440);
    if (currentDay > state.lastDayCharged) {
      if (chargeDailyFees(currentDay - state.lastDayCharged)) return { repossessed: true };
      state.lastDayCharged = currentDay;
    }

    state.fleet.slice().forEach(aircraft => {
      const route = aircraftSimulationRoute(aircraft, state.gameMinutes - step);
      if (route) advanceAircraft(aircraft, route, step);
    });
    remaining -= step;
  }

  return {
    simulatedMinutes,
    wasCapped: elapsedRealMinutes > simulatedMinutes,
    cashChange: state.cash - before.cash,
    revenue: state.finance.totalRevenue - before.revenue,
    costs: state.finance.totalCost - before.cost,
    passengers: state.finance.totalPassengers - before.passengers
  };
}

function renderMapAircraftPositions() {
  if (!map) return;
  const centerLon = map.getCenter().lng;
  state.fleet.forEach(f => {
    if (!["Flying", "Turnaround", "Scheduled", "Maintenance"].includes(f.status)) return;
    const marker = ensureAircraftMarker(f);
    const type = aircraftTypeById(f.typeId);
    marker.setLatLng([f.lat, unwrapLongitude(f.lon, centerLon)]);
    // Keep the same marker DOM node so mouse-down and mouse-up reach the same
    // clickable element. Only replace the icon if the aircraft type changes;
    // normal heading updates rotate the existing SVG in place.
    if (marker._aircraftIconTypeId !== f.typeId) {
      marker.setIcon(planeIcon(f.heading || 0, "#f5b942", type));
      marker._aircraftIconTypeId = f.typeId;
    } else {
      const svg = marker.getElement() && marker.getElement().querySelector("svg");
      if (svg) svg.style.transform = `rotate(${f.heading || 0}deg)`;
    }
  });
}

  const f = state.fleet.find(aircraft => aircraft.fid === fid);

function sellAircraft(fid) {
  const index = state.fleet.findIndex(aircraft => aircraft.fid === fid);
  if (index === -1 || state.routes.some(route => route.aircraftFid === fid)) return;
  const f = state.fleet[index];
  const resaleValue = aircraftResaleValue(f);
  state.cash += resaleValue;
  state.finance.totalAircraftSaleProceeds += resaleValue;
  if (state.liveries) delete state.liveries[fid];
  state.fleet.splice(index, 1);
  removeAircraftMarker(fid);
  closeModal();
  renderTopBar();
  renderFleet();
  if (currentScreen === "purchase") renderPurchase();
  if (currentScreen === "operations") renderOperations();
  if (currentScreen === "finances") renderFinances();
  saveGame();
  toast(`Sold ${f.reg} for ${fmtMoney(resaleValue)}.`);
}

function nearestAirportLabel(f) {
  if (f.status === "Turnaround" && f.turnaroundIata) return `${f.turnaroundIata} (on stand)`;
  if ((f.status === "Scheduled" || f.status === "Maintenance") && f.routeId) {
    const route = state.routes.find(r => r.rid === f.routeId);
    if (route) return `${route.origin} (parked)`;
  }
  if (f.status === "Idle" && f.homeIata) return f.homeIata + " (parked)";
  if (!f.routeId) return "—";
  const route = state.routes.find(r => r.rid === f.routeId);
  if (!route) return "—";
  return `→ ${getCurrentPhysicalLeg(f, route).to}`;
}

  const routeCount = state.routes.filter(r => r.waypoints.includes(a.iata)).length;
  return `<div class="airport-card owned">

function renderAirportBrowseGrid() {
  const grid = document.getElementById("airportBrowseGrid");
  if (!grid) return;
  const q = hubSearchQuery.trim().toLowerCase();
  let list = AIRPORTS.filter(a => !state.hubs.includes(a.iata));
  if (q) list = list.filter(a => a.iata.toLowerCase().includes(q) || a.city.toLowerCase().includes(q) || a.country.toLowerCase().includes(q) || a.name.toLowerCase().includes(q));
  list = list.sort((a, b) => b.size - a.size || b.demand - a.demand).slice(0, 60);
  grid.innerHTML = list.map(a => `
    <div class="airport-card">
      <div class="airport-card-head"><b>${a.iata}</b><span>${a.city}, ${a.country}</span></div>

function purchaseHub(iata) {
  const a = airportByIata(iata);
  if (!a || state.hubs.includes(iata) || state.cash < a.hubPrice) return;
  state.cash -= a.hubPrice;
  state.hubs.push(iata);
  refreshHubMarkers();
  renderTopBar();
  renderHubs();
  saveGame();
  toast(`${a.city} (${a.iata}) is now a hub!`);
}

function aircraftViewerGeometryStyle(savedLivery) {
  const fallback = { canvasWidth: 1200, canvasHeight: 500, x: 34, y: 84.12, width: 1132, height: 331.76 };
  const candidate = savedLivery && savedLivery.viewerGeometry;
  const geometry = candidate && [candidate.canvasWidth, candidate.canvasHeight, candidate.x, candidate.y, candidate.width, candidate.height]
    .every(value => Number.isFinite(Number(value))) && Number(candidate.width) > 0 && Number(candidate.height) > 0
      ? candidate
      : fallback;
  const canvasWidth = Number(geometry.canvasWidth), canvasHeight = Number(geometry.canvasHeight);
  const x = Number(geometry.x), y = Number(geometry.y), width = Number(geometry.width), height = Number(geometry.height);
  return [
    `--aircraft-stage-aspect:${(width / height).toFixed(6)}`,
    `--aircraft-overlay-left:${(-x / width * 100).toFixed(5)}%`,
    `--aircraft-overlay-top:${(-y / height * 100).toFixed(5)}%`,
    `--aircraft-overlay-width:${(canvasWidth / width * 100).toFixed(5)}%`,
    `--aircraft-overlay-height:${(canvasHeight / height * 100).toFixed(5)}%`
  ].join(";");
}

/* ---- Map route planner (keeps the player on the world map) ---- */
let mapRoutePlanner = {
  active: false,
  selecting: "dest",
  form: { origin: null, stopover: null, dest: null, aircraftFid: null, scheduleDays: [0,1,2,3,4,5,6], scheduleTimes: "08:00" }
};

function routePlanWaypoints(form) {
  return [form.origin, ...(form.stopover ? [form.stopover] : []), form.dest].filter(Boolean);
}

function calculateRoutePlan(form) {
  const aircraft = form.aircraftFid ? state.fleet.find(f => f.fid === form.aircraftFid) : null;
  const type = aircraft ? aircraftTypeById(aircraft.typeId) : null;
  const waypoints = routePlanWaypoints(form);
  const legs = [];
  let distance = 0, revenue = 0, cost = 0;

  if (form.origin && form.dest) {
    for (let i = 0; i < waypoints.length - 1; i++) {
      const est = computeRouteEstimate(waypoints[i], waypoints[i + 1], type ? type.id : null);
      legs.push(est);
      distance += est.distance;
      revenue += est.revenue;
      cost += est.cost;
    }
  }

  const inRange = !!(type && legs.length && legs.every(leg => leg.distance <= type.range));
  const openingCost = routeOpeningCost(distance, type);
  const canAfford = state.cash >= openingCost;
  const schedule = normalizeRouteSchedule(form);
  const durationMinutes = routeCircuitMinutes(legs, type);
  const availability = aircraft && schedule && form.origin
    ? aircraftScheduleAvailability(aircraft, schedule, durationMinutes, form.origin)
    : { ok: false, message: "Choose an aircraft and schedule." };
  return { aircraft, type, waypoints, legs, distance, revenue, cost, openingCost, profit: revenue - cost, inRange, canAfford, schedule, durationMinutes, availability, canLaunch: !!(form.origin && form.dest && aircraft && inRange && canAfford && schedule && availability.ok) };
}

function startMapRoutePlanner(originIata) {
  mapRoutePlanner = {
    active: true,
    selecting: "dest",
    form: { origin: originIata, stopover: null, dest: null, aircraftFid: null, scheduleDays: [0,1,2,3,4,5,6], scheduleTimes: "08:00" }
  };
  showMapRoutePlanner();
  toast("Click a destination airport on the map.");
}

function showMapRoutePlanner() {
  if (!mapRoutePlanner.active) return;
  const form = mapRoutePlanner.form;
  const plan = calculateRoutePlan(form);
  const schedulableAircraft = state.fleet;
  const summary = form.dest
      ? `<div class="map-route-summary">
        <span>${fmtNum(plan.distance)} km total</span>
        ${plan.type ? `<span class="${plan.canAfford ? "" : "negative"}">${fmtMoneyShort(plan.openingCost)} opening fee${plan.canAfford ? "" : " — insufficient cash"}</span>` : ""}
        <span class="${plan.type ? (plan.inRange ? "positive" : "negative") : ""}">
          ${plan.type ? (plan.inRange ? `${fmtMoneyShort(plan.profit)} est. profit` : "Aircraft out of range") : "Choose an aircraft"}
        </span>
      </div>`
    : `<p class="map-popup-sub">Click an airport pin to set the destination.</p>`;

  showMapSheet(`
    <div class="map-popup">
      <div class="map-popup-title">Plan Route on Map</div>
      <div class="map-popup-sub">Choose what your next airport-pin click should set.</div>
      <div class="map-route-mode-row">
        <button class="map-route-mode-btn ${mapRoutePlanner.selecting === "dest" ? "active" : ""}" onclick="mapPlannerSelectMode('dest')">Select destination</button>
        <button class="map-route-mode-btn ${mapRoutePlanner.selecting === "stopover" ? "active" : ""}" onclick="mapPlannerSelectMode('stopover')">Select stopover</button>
      </div>
      <div class="map-route-points">
        <div class="map-route-point"><span>Origin</span><b>${form.origin || "—"}</b></div>
        <div class="map-route-point"><span>Stopover</span><b>${form.stopover || "—"}</b></div>
        <div class="map-route-point"><span>Destination</span><b>${form.dest || "—"}</b></div>
      </div>
      <select class="map-route-aircraft" onchange="mapPlannerSetAircraft(this.value)">
        <option value="">Select aircraft…</option>
        ${schedulableAircraft.map(f => {
          const assignedCount = state.routes.filter(r => r.status === "Active" && r.aircraftFid === f.fid).length;
          return `<option value="${f.fid}" ${form.aircraftFid === f.fid ? "selected" : ""}>${f.reg} — ${aircraftTypeById(f.typeId).name}${assignedCount ? ` · ${assignedCount} route${assignedCount === 1 ? "" : "s"}` : ""}</option>`;

      <div class="form-row" style="max-width:none">
        <label>Departure times <span class="form-hint">24-hour time; separate multiple times with commas</span></label>

      <details class="map-planner-timetable">
        <summary>Preview weekly timetable</summary>
        ${plan.aircraft ? buildAircraftScheduleGraph(plan.aircraft.fid, plan.schedule ? { schedule: plan.schedule, waypoints: plan.waypoints, durationMinutes: plan.durationMinutes } : null) : buildScheduleGraph(plan.schedule, plan.waypoints, plan.durationMinutes)}
      </details>
      ${plan.aircraft && plan.schedule ? `<p class="${plan.availability.ok ? "positive" : "negative"}">${plan.availability.message}</p>` : ""}

      <div class="map-route-actions">
        <button class="map-popup-btn" onclick="launchMapPlannedRoute()" ${plan.canLaunch ? "" : "disabled"}>Launch route</button>

        <button class="map-popup-btn danger" onclick="cancelMapRoutePlanner()">Cancel</button>

}

function mapPlannerSelectMode(mode) {
  mapRoutePlanner.selecting = mode === "stopover" ? "stopover" : "dest";
  showMapRoutePlanner();
  toast(`Click an airport pin to set the ${mapRoutePlanner.selecting === "dest" ? "destination" : "stopover"}.`);
}

function selectMapRouteAirport(iata) {
  if (!mapRoutePlanner.active) return;
  const form = mapRoutePlanner.form;
  if (iata === form.origin) { toast("The origin cannot also be the destination or stopover."); return; }

  if (mapRoutePlanner.selecting === "stopover") {
    if (iata === form.dest) { toast("The stopover must be different from the destination."); return; }
    form.stopover = iata;
    mapRoutePlanner.selecting = "dest";
  } else {
    if (iata === form.stopover) { toast("The destination must be different from the stopover."); return; }
    form.dest = iata;
  }
  showMapRoutePlanner();
}

function mapPlannerSetAircraft(fid) {
  mapRoutePlanner.form.aircraftFid = fid || null;
  showMapRoutePlanner();
}

function mapPlannerToggleDay(day) {
  const days = mapRoutePlanner.form.scheduleDays;
  mapRoutePlanner.form.scheduleDays = days.includes(day) ? days.filter(d => d !== day) : [...days, day].sort((a, b) => a - b);
  showMapRoutePlanner();
}

function mapPlannerSetTimes(value) {
  mapRoutePlanner.form.scheduleTimes = value;
  showMapRoutePlanner();
}

function mapPlannerClearStopover() {
  mapRoutePlanner.form.stopover = null;
  showMapRoutePlanner();
}

function cancelMapRoutePlanner() {
  mapRoutePlanner = {
    active: false,
    selecting: "dest",
    form: { origin: null, stopover: null, dest: null, aircraftFid: null, scheduleDays: [0,1,2,3,4,5,6], scheduleTimes: "08:00" }
  };
  closeMapSheet();
}

function launchMapPlannedRoute() {
  const route = createRouteFromPlan(mapRoutePlanner.form);
  if (!route) { showMapRoutePlanner(); return; }
  mapRoutePlanner.active = false;
  closeMapSheet();
  completeRouteLaunchUi(route);
}

function populateDestSelect() {
  const sel = document.getElementById("routeDestSelect");

  list = list.sort((a, b) => b.demand - a.demand).slice(0, 80);
  sel.innerHTML = list.map(a => `<option value="${a.iata}" ${routeForm.dest === a.iata ? "selected" : ""}>${a.iata} — ${a.city}, ${a.country}</option>`).join("");
}

function populateStopoverSelect() {
  const sel = document.getElementById("routeStopoverSelect");
  if (!sel) return;
  const q = document.getElementById("routeStopoverSearch").value.trim().toLowerCase();
  let list = AIRPORTS.filter(a => a.iata !== routeForm.origin && a.iata !== routeForm.dest);
  if (q) list = list.filter(a => a.iata.toLowerCase().includes(q) || a.city.toLowerCase().includes(q) || a.country.toLowerCase().includes(q));

}

function currentRouteFormWaypoints() {
  return [routeForm.origin, ...(routeForm.stopover ? [routeForm.stopover] : []), routeForm.dest].filter(Boolean);
}

function updateRouteEstimate() {
  const box = document.getElementById("routeEstimateBox");
  const launchBtn = document.getElementById("launchRouteBtn");
  if (!box) return;
  if (!routeForm.origin || !routeForm.dest) {
    box.innerHTML = `<p class="empty-msg">Select an origin and destination to see route economics.</p>`;
    launchBtn.disabled = true;
    return;
  }
  const waypoints = currentRouteFormWaypoints();
  const fleetAc = routeForm.aircraftFid ? state.fleet.find(f => f.fid === routeForm.aircraftFid) : null;
  const typeId = fleetAc ? fleetAc.typeId : null;
  const type = typeId ? aircraftTypeById(typeId) : null;

  const legs = [];
  let totalDistance = 0, totalRevenue = 0, totalCost = 0, totalPassengers = 0;
  for (let i = 0; i < waypoints.length - 1; i++) {
    const est = computeRouteEstimate(waypoints[i], waypoints[i + 1], typeId);
    legs.push({ from: waypoints[i], to: waypoints[i + 1], distance: est.distance, inRange: est.inRange });
    totalDistance += est.distance;
    totalRevenue += est.revenue;
    totalCost += est.cost;
    totalPassengers += est.passengers;
  }
  const allInRange = type ? legs.every(l => l.distance <= type.range) : null;
  const totalProfit = type ? totalRevenue - totalCost : null;
  const openingCost = routeOpeningCost(totalDistance, type);
  const canAfford = state.cash >= openingCost;
  const schedule = normalizeRouteSchedule(routeForm);
  const durationMinutes = routeCircuitMinutes(legs, type);
  const availability = fleetAc && schedule
    ? aircraftScheduleAvailability(fleetAc, schedule, durationMinutes, routeForm.origin)
    : { ok: false, message: "Choose an aircraft and schedule." };

  let legsHtml = "";
  if (legs.length > 1) {
    legsHtml = `<div class="leg-breakdown">` + legs.map(l => `
      <div class="leg-row">
        <b>${l.from} → ${l.to}</b> · ${fmtNum(l.distance)} km
        ${type ? (l.distance <= type.range ? ` <span class="positive">✅ in range</span>` : ` <span class="negative">❌ out of range</span>`) : ""}
      </div>`).join("") + `</div>`;
  }

  let rangeHtml = "";
  if (type) {
    const longestLeg = Math.max(...legs.map(l => l.distance));
    rangeHtml = `<div class="range-check ${allInRange ? 'ok' : 'bad'}">
      <div>Longest leg: <b>${fmtNum(longestLeg)} km</b></div>
      <div>Aircraft range: <b>${fmtNum(type.range)} km</b></div>
      <div class="range-status">${allInRange ? "✅ Aircraft can operate every leg of this route" : "❌ Insufficient range for at least one leg"}</div>
    </div>`;
  }

  box.innerHTML = `
    <div class="stat-grid compact">
      <div class="stat-card"><div class="stat-label">Total distance</div><div class="stat-value">${fmtNum(totalDistance)} km</div></div>
      <div class="stat-card"><div class="stat-label">Est. passengers/circuit</div><div class="stat-value">${fmtNum(totalPassengers)} pax</div></div>
      <div class="stat-card"><div class="stat-label">Est. revenue/circuit</div><div class="stat-value">${fmtMoneyShort(totalRevenue)}</div></div>
      ${type ? `<div class="stat-card"><div class="stat-label">Est. cost/circuit</div><div class="stat-value">${fmtMoneyShort(totalCost)}</div></div>
      <div class="stat-card"><div class="stat-label">Est. profit/circuit</div><div class="stat-value ${totalProfit >= 0 ? 'positive' : 'negative'}">${fmtMoneyShort(totalProfit)}</div></div>
      <div class="stat-card"><div class="stat-label">One-time opening fee</div><div class="stat-value ${canAfford ? '' : 'negative'}">${fmtMoneyShort(openingCost)}</div></div>` : ""}
    </div>
    ${type && !canAfford ? `<p class="negative">You need ${fmtMoney(openingCost - state.cash)} more cash to open this route.</p>` : ""}
    <p class="${schedule ? "positive" : "negative"}">${schedule ? `Scheduled departures: ${formatRouteSchedule(schedule)}` : "Select at least one departure day and enter a valid time such as 08:00."}</p>
    ${type && durationMinutes ? `<p class="map-popup-sub">Each departure reserves this aircraft for <b>${formatDuration(durationMinutes)}</b>, including the return flight and maximum turnarounds.</p>` : ""}
    ${fleetAc ? buildAircraftScheduleGraph(fleetAc.fid, schedule ? { schedule, waypoints, durationMinutes } : null) : buildScheduleGraph(schedule, waypoints, durationMinutes)}
    ${fleetAc && schedule ? `<p class="${availability.ok ? "positive" : "negative"}">${availability.message}</p>` : ""}
    ${legsHtml}
    ${rangeHtml}
  `;
  launchBtn.disabled = !(type && allInRange && canAfford && schedule && availability.ok);
}

function estimateRouteFarePerformance(route, type, fares) {
  return route.legs.reduce((totals, leg) => {
    const estimate = computeRouteEstimate(leg.from, leg.to, type.id, fares);
    totals.passengers += estimate.passengers;
    totals.revenue += estimate.revenue;
    totals.cost += estimate.cost;
    return totals;
  }, { passengers: 0, revenue: 0, cost: 0 });
}

function showRouteFareEditor(rid) {
  const route = state.routes.find(r => r.rid === rid);
  const aircraft = route ? state.fleet.find(f => f.fid === route.aircraftFid) : null;
  if (!route || !aircraft) return;
  const type = aircraftTypeById(aircraft.typeId);
  const classes = availableCabinClasses(type);
  const shares = cabinSeatShares(classes);
  const fares = normalizedRouteTicketPrices(route, type);
  const recommended = defaultRouteTicketPrices(route.legs, type);
  const performance = estimateRouteFarePerformance(route, type, fares);
  showModal(`
    <h2>Edit Fares · ${route.waypoints.join(" → ")}</h2>
    <p class="modal-sub">${aircraft.reg} · ${type.name}. Prices apply per passenger on each flight leg.</p>
    <div class="stat-grid compact">
      ${classes.map(classId => {
        const seats = Math.round(type.capacity * shares[classId]);
        return `<div class="stat-card"><div class="stat-label">${CABIN_CLASS_META[classId].label} seats</div><div class="stat-value">${seats}</div></div>`;
      }).join("")}
      <div class="stat-card"><div class="stat-label">Est. passengers / outbound circuit</div><div class="stat-value">${fmtNum(performance.passengers)}</div></div>
      <div class="stat-card"><div class="stat-label">Est. fare revenue</div><div class="stat-value">${fmtMoneyShort(performance.revenue)}</div></div>
    </div>
    ${classes.length === 1 ? `<p class="account-notice">This smaller aircraft has an economy-only cabin.</p>` : ""}
    <div class="stat-grid compact">
      ${classes.map(classId => `<div class="form-row">
        <label for="fareInput-${classId}">${CABIN_CLASS_META[classId].label} fare <span class="form-hint">Recommended ${fmtMoney(recommended[classId])}</span></label>
        <input type="number" id="fareInput-${classId}" min="10" max="100000" step="5" value="${fares[classId]}" />
      </div>`).join("")}
    </div>
    <p class="empty-msg">Higher prices earn more per passenger but reduce demand and load factor. Lower prices attract more passengers, limited by the seats in that cabin.</p>
    <div class="button-row">
      <button class="btn btn-primary" onclick="saveRouteFares('${rid}')">Save fares</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

function saveRouteFares(rid) {
  const route = state.routes.find(r => r.rid === rid);
  const aircraft = route ? state.fleet.find(f => f.fid === route.aircraftFid) : null;
  if (!route || !aircraft) return;
  const type = aircraftTypeById(aircraft.typeId);
  const prices = {};
  for (const classId of availableCabinClasses(type)) {
    const value = Number(document.getElementById(`fareInput-${classId}`).value);
    if (!Number.isFinite(value) || value < 10 || value > 100000) {
      toast("Enter a fare between $10 and $100,000 for every available cabin.");
      return;
    }
    prices[classId] = Math.round(value);
  }
  route.ticketPrices = prices;
  closeModal();
  renderRoutes();
  saveGame();
  toast(`Fares updated for ${route.waypoints.join(" → ")}.`);
}

function showRouteTimetable(rid) {
  const route = state.routes.find(r => r.rid === rid);
  if (!route) return;
  const aircraft = route.aircraftFid ? state.fleet.find(f => f.fid === route.aircraftFid) : null;
  if (aircraft) { showAircraftTimetable(aircraft.fid); return; }
  showModal(`
    <h2>${route.waypoints.join(" → ")} Timetable</h2>

    ${buildScheduleGraph(route.schedule, route.waypoints, route.plannedDurationMinutes)}
    <button class="btn btn-primary" onclick="closeModal()">Close</button>
  `);
}

function showAircraftTimetable(fid) {
  const aircraft = state.fleet.find(f => f.fid === fid);
  if (!aircraft) return;
  const routes = state.routes.filter(r => r.status === "Active" && r.aircraftFid === fid);
  showModal(`
    <h2>${aircraft.reg} Weekly Timetable</h2>
    <p class="map-popup-sub">${aircraftTypeById(aircraft.typeId).name} · ${routes.length} assigned route${routes.length === 1 ? "" : "s"}. Each block includes the round trip and reserved turnaround time.</p>
    ${buildAircraftScheduleGraph(fid)}
    <button class="btn btn-primary" onclick="closeModal()">Close</button>
  `);
}

function createRouteFromPlan(plan) {
  if (!plan.origin || !plan.dest || !plan.aircraftFid) return null;
  const f = state.fleet.find(x => x.fid === plan.aircraftFid);
  if (!f) return null;
  const type = aircraftTypeById(f.typeId);
  const hasScheduleInput = !!plan.schedule || Array.isArray(plan.scheduleDays) || plan.scheduleTimes !== undefined;
  const schedule = normalizeRouteSchedule(plan) || (!hasScheduleInput ? { days: [0,1,2,3,4,5,6], times: [480] } : null);
  if (!schedule) return null;
  const waypoints = routePlanWaypoints(plan);
  const legs = buildRouteLegs(waypoints);
  if (!legs.length || !legs.every(l => l.distance <= type.range)) return null;
  const plannedDurationMinutes = routeCircuitMinutes(legs, type);
  const availability = aircraftScheduleAvailability(f, schedule, plannedDurationMinutes, waypoints[0]);
  if (!availability.ok) return null;
  const totalDistance = legs.reduce((sum, leg) => sum + leg.distance, 0);
  const openingCost = routeOpeningCost(totalDistance, type);
  if (state.cash < openingCost) return null;

  const route = {
    rid: uid("rt"), waypoints, legs,
    origin: waypoints[0], dest: waypoints[waypoints.length - 1], // kept for quick reference/back-compat
    distance: totalDistance,
    schedule,
    ticketPrices: defaultRouteTicketPrices(legs, type),
    plannedDurationMinutes,
    openingCost,
    aircraftFid: f.fid, status: "Active",
    stats: { revenue: 0, cost: openingCost, profit: -openingCost, passengers: 0, flights: 0, lastRevenue: 0, lastCost: 0, lastProfit: 0 }
  };
  state.cash -= openingCost;
  state.finance.totalCost += openingCost;
  state.finance.totalProfit -= openingCost;
  state.finance.totalRouteOpeningCosts += openingCost;
  const hadAssignments = state.routes.some(existing => existing.aircraftFid === f.fid);
  state.routes.push(route);
  ensureAircraftOperations(f);
  if (!hadAssignments) {
    refuelAircraft(f);
    f.progress = 0; f.dir = "out"; f.legIndex = 0;
    f.turnaroundMinutes = 0; f.turnaroundIata = null; f.turnaroundReason = null; f.karenDelayMinutes = 0;
    const o = airportByIata(waypoints[0]);
    f.lat = o.lat; f.lon = o.lon; f.homeIata = waypoints[0];
    setAircraftNextDeparture(f, state.gameMinutes, true);
  } else if (f.status === "Scheduled") {
    setAircraftNextDeparture(f, state.gameMinutes, true);
  }

  drawRouteLine(route);
  ensureAircraftMarker(f);
  return route;
}

function completeRouteLaunchUi(route) {
  renderRoutes();
  renderTopBar();
  saveGame();
  toast(`Route launched for ${fmtMoneyShort(route.openingCost)}: ${route.waypoints.join(" → ")}`);
}

function launchRoute() {
  const route = createRouteFromPlan(routeForm);
  if (!route) return;
  routeForm = { origin: routeForm.origin, stopover: null, dest: null, aircraftFid: null, scheduleDays: [...routeForm.scheduleDays], scheduleTimes: routeForm.scheduleTimes };
  completeRouteLaunchUi(route);
}

function cancelRoute(rid) {
  const idx = state.routes.findIndex(r => r.rid === rid);
  if (idx === -1) return;
  const route = state.routes[idx];
  const f = state.fleet.find(x => x.fid === route.aircraftFid);
  const wasCurrent = !!(f && (f.activeRouteId === rid || f.routeId === rid || f.nextDepartureRouteId === rid));
  state.routes.splice(idx, 1);
  removeRouteLine(rid);
  if (f) {
    ensureAircraftOperations(f);
    const remainingRoutes = state.routes.filter(r => r.status === "Active" && r.aircraftFid === f.fid);
    if (wasCurrent) {
      f.progress = 0; f.legIndex = 0; f.dir = "out";
      f.turnaroundMinutes = 0; f.turnaroundIata = null; f.turnaroundReason = null; f.karenDelayMinutes = 0; f.maintenanceMinutes = 0;
      f.returnedToOriginPending = false; f.activeRouteId = null;
      const parkingIata = remainingRoutes[0]?.origin || f.homeIata;
      const parkingAirport = parkingIata ? airportByIata(parkingIata) : null;
      if (parkingAirport) { f.lat = parkingAirport.lat; f.lon = parkingAirport.lon; }
    }
    if (remainingRoutes.length && (wasCurrent || f.status === "Scheduled")) {
      setAircraftNextDeparture(f, state.gameMinutes, true);
    } else if (!remainingRoutes.length) {
      f.status = "Idle"; f.routeId = null; f.activeRouteId = null;
      f.nextDepartureGameMinute = null; f.nextDepartureRouteId = null;
      removeAircraftMarker(f.fid);
    }
  }
  renderRoutes();
  renderFleet();
  saveGame();
}
